<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10131c">
<title>점 잇기 퍼즐</title>
<style>
  /* Layout: centered single-column game board with a compact status bar above */
  :root{--bg:#10131c;--panel:#1a1f2e;--fg:#e8ecf5;--muted:#8791a8;--line:#2a3147;--accent:#5b8cff;--ok:#7dffb0;color-scheme:dark}
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;padding-inline:16px;padding-block:16px;display:flex;flex-direction:column;align-items:center;gap:12px;-webkit-user-select:none;user-select:none}
  h1{margin:4px 0 0;font-size:22px;text-wrap:balance}
  .sub{color:var(--muted);font-size:13px;margin:0;text-align:center;max-width:46ch}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
  button{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:15px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--accent)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .stat{background:var(--panel);border-radius:10px;padding:8px 14px;font-size:14px;text-align:center;font-variant-numeric:tabular-nums}
  canvas{width:min(100%,520px);aspect-ratio:1;touch-action:none;border-radius:14px;background:#0b0e15}
  #msg{min-height:24px;font-weight:600;color:var(--ok)}
  button:disabled{opacity:.35;cursor:default}
  button.go{border-color:var(--ok);color:var(--ok);animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 4px #7dffb033}}
  @media (prefers-reduced-motion:reduce){button.go{animation:none}}
  .chip{border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
  .chip.k0,#grid .k0{--c:#3ddc84}.chip.k1,#grid .k1{--c:#ffd23f}.chip.k2,#grid .k2{--c:#ff4d4d}.chip.k3,#grid .k3{--c:#4dd2ff}
  .chip{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
  #sel{width:min(100%,520px);max-height:260px;overflow-y:auto;background:var(--panel);border-radius:12px;padding:10px}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
  #grid button{padding:8px 0;font-size:13px;font-variant-numeric:tabular-nums;border-color:color-mix(in srgb,var(--c) 40%,var(--line))}
  #grid button.done{background:color-mix(in srgb,var(--c) 16%,var(--panel))}
  #grid button.cur{outline:2px solid var(--fg)}
  .acct{display:flex;flex-direction:column;align-items:center;gap:6px}
  #userBox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
  .note{color:var(--muted);font-size:12px}
  .chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
  #auth{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
  #auth[hidden]{display:none}
  #authForm{background:var(--panel);border-radius:14px;padding:18px;width:min(100%,340px);display:flex;flex-direction:column;gap:8px}
  #authForm label{font-size:13px;color:var(--muted)}
  #authForm input[type=text],#authForm input[type=password],#uid{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:15px;font-family:inherit}
  .tabs,.row{display:flex;gap:8px}
  .tabs button{flex:1}.tabs button.on{border-color:var(--accent);color:var(--accent)}
  .row .primary{flex:1;background:var(--accent);border-color:var(--accent);color:#fff}
  #err{min-height:18px;font-size:13px;color:#ff7a7a}
  html{overscroll-behavior:none;-webkit-text-size-adjust:100%}
  body{min-height:100%;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;padding-bottom:max(16px,env(safe-area-inset-bottom))}
  button{min-height:40px}
  /* 모바일: 주소창·하단 막대에 가리지 않게 아래 여백을 크게 두고, 판이 한 화면에 들어오도록 높이에 맞춘다 */
  [hidden]{display:none!important}
  /* 스크롤 없이 한 화면에: 판 크기는 자바스크립트가 남은 높이에 맞춘다 */
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{height:100vh;height:100dvh;box-sizing:border-box;touch-action:none;gap:8px;padding-block:10px calc(10px + env(safe-area-inset-bottom))}
  h1{margin:0;font-size:20px}
  .acct{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:4px 10px}
  .acct .note{flex-basis:100%;text-align:center;font-size:12px}
  #sel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,520px);max-height:70vh;max-height:70dvh;z-index:7;box-shadow:0 10px 40px rgba(0,0,0,.6);touch-action:pan-y;overscroll-behavior:contain}
  @media (max-height:760px){.sub{display:none}}
  /* 좁은 화면: 머리 부분을 낮춰 판에 높이를 더 준다 */
  button{min-height:36px;padding:6px 11px;font-size:14px}
  .stat{padding:6px 10px;font-size:13px}
  .bar{gap:6px}
  #modes{gap:5px}
  #modes button{padding:6px 12px}
  #msg{min-height:20px;line-height:20px;font-size:14px}
  h1{font-size:19px}
  @media (max-height:480px){html,body{overflow:auto}body{height:auto;min-height:100%}}
  #modes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
    h1,.sub,.note{text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .sub,.note{color:#e3e9f7}
  button{position:relative;overflow:hidden;transition:transform .08s ease,box-shadow .18s ease,border-color .18s ease,background-color .18s ease}
  button:not(:disabled):hover{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
  button:not(:disabled):active{transform:scale(.94)}
  .rip{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.38);transform:scale(0);animation:rip .5s ease-out forwards}
  @keyframes rip{to{transform:scale(1);opacity:0}}
  #musicBtn{font-size:13px;padding:6px 12px;min-height:34px}
  #musicBtn[aria-pressed=false]{opacity:.6}
  #modes button.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--panel))}
</style>
</head>
<body>
<h1>점 잇기 퍼즐</h1>
<p class="sub">같은 색 점끼리 선으로 연결하고, 판의 모든 칸을 채우세요. 선은 서로 겹칠 수 없어요.</p>
<div class="acct">
  <div id="guestBox"><button id="openAuth">로그인 / 회원가입</button></div>
  <div id="userBox" hidden><b id="who"></b><label class="chk"><input type="checkbox" id="auto"> 자동 로그인</label><button id="logout">로그아웃</button></div>
  <button id="musicBtn" aria-pressed="true">♪ 소리 켬</button>
  <div class="note" id="note"></div>
</div>
<div id="auth" hidden>
  <form id="authForm" autocomplete="off">
    <div class="tabs"><button type="button" id="tabLogin" class="on">로그인</button><button type="button" id="tabSignup">회원가입</button></div>
    <label for="uid">아이디</label><input id="uid" maxlength="16" autocomplete="username">

    <label class="chk"><input type="checkbox" id="autoNew" checked> 자동 로그인</label>
    <div id="err" role="alert"></div>
    <div class="row"><button type="submit" id="go" class="primary">로그인</button><button type="button" id="closeAuth">닫기</button></div>
  </form>
</div>
<div id="modes"><button data-mode="easy">쉬움</button><button data-mode="normal">보통</button><button data-mode="hard">어려움</button><button data-mode="extreme">익스트림</button></div>
<div class="bar">
  <button id="prev" aria-label="이전 스테이지">◀</button>
  <div class="stat" id="lvl">스테이지 1</div><div class="chip k0" id="diff" hidden></div>
  <button id="next" aria-label="다음 스테이지">▶</button>
  <div class="stat" id="flows">연결 0/0</div>
  <div class="stat" id="fill">채움 0%</div>
  <button id="hint">힌트</button>
  <button id="reset">다시</button>
  <button id="pick">목록</button>
</div>
<canvas id="c" width="520" height="520"></canvas>
<div id="msg"></div>
<div id="sel" hidden><div id="grid"></div></div>
<script>
// 이 파일을 단독으로 열면 계정은 이 기기의 브라우저에만 저장된다
(function(){
  if (window.claude && window.claude.use) return;
  var KEY = 'dotsLocalDb';
  function load(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
  function save(o){ localStorage.setItem(KEY, JSON.stringify(o)); }
  var db = { doc: function(p){ return {
    get: async function(){ var d = load()[p]; return { exists: !!d, data: function(){ return d; } }; },
    set: async function(x){ var o = load(); o[p] = x; save(o); },
    update: async function(x){ var o = load(); o[p] = Object.assign({}, o[p], x); save(o); }
  }; } };
  window.claude = { use: async function(n){ return n === 'db' ? db : null; } };
})();
</script>

const TOTAL = 480;
const KINDS = ['', '어려움', '하드', '쉬움'];

// 스테이지가 올라갈수록 조금씩 계속 어려워진다: 판이 커지고, 선이 길고 구불해지고, 색이 늘어난다
function stageParams(i){
  const d = i / (TOTAL - 1), no = i + 1;
  // 1~60번은 쉬움: 4×4, 5×5, 6×6 중 무작위. 이후는 갈수록 어려워진다.
  // 10스테이지마다 어려움, 300스테이지부터는 어려움과 하드가 번갈아 나온다.
  let kind = 0;
  if (no % 10 === 0) kind = no >= 300 && (no / 10) % 2 === 0 ? 2 : 1;
  const base = no <= 60 ? 4 + Math.floor(mulberry32(no * 31 + 5)() * 3) : 6 + Math.min(4, Math.floor((no - 61) / 440 * 5));
  return {
    kind, d,
    n: Math.min(12, base + [0, 1, 2, 0][kind]),
    pBreak: 0.30 - 0.22 * d - [0, 0.04, 0.07, 0][kind],
    lo: 0.7, hi: 1.0 + 0.3 * d
  };
}
function maxHints(kind){ return kind === 1 || kind === 2 ? 3 : 2; }

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function neighbors(i, n){
  const r = Math.floor(i / n), c = i % n, out = [];
  if (r > 0) out.push(i - n);
  if (r < n - 1) out.push(i + n);
  if (c > 0) out.push(i - 1);
  if (c < n - 1) out.push(i + 1);
  return out;
}

const levelCache = {};
function makeLevel(idx){
  const ck = MODE + idx;
  if (levelCache[ck]) return levelCache[ck];
  const P = stageParams(idx), parts = STAGESETS[MODE][idx].split('|'), n = +parts[0];
  const sol = parts[1].split(',').map(t => {

    for (const ch of d) p.push(p[p.length - 1] + (ch === 'R' ? 1 : ch === 'L' ? -1 : ch === 'D' ? n : -n));
    return p;
  });
  return (levelCache[ck] = { n, sol, pairs: sol.map(p => [p[0], p[p.length - 1]]), kind: P.kind });
}

  cv.style.cssText = 'position:fixed;left:0;top:0;width:100%;height:100%;z-index:-1;pointer-events:none;background:none;border-radius:0;aspect-ratio:auto;max-width:none';
  document.body.insertBefore(cv, document.body.firstChild);
  const g = cv.getContext('2d');
  const scene = document.createElement('canvas'), sg = scene.getContext('2d');
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const lcg = seed => { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; };
  let W = 0, H = 0, D = 1, season = 'summer', parts = [], clouds = [], stars = [], gulls = [], raf = 0, last = 0;

  // ----- 그리기 도우미 -----
  // 부드러운 1차원 노이즈: 산등성이와 언덕의 윤곽을 자연스럽게 만든다
  function noiseFn(seed){
    const r = lcg(seed), v = []; for (let i = 0; i < 256; i++) v.push(r());
    const sm = t => t * t * (3 - 2 * t);
    return x => { const i = Math.floor(x), f = sm(x - i); return v[i & 255] * (1 - f) + v[(i + 1) & 255] * f; };
  }
  function ridgeY(nf, x, y0, amp, scale, ridged){
    let s = 0, a = 1, f = scale, tot = 0;
    for (let o = 0; o < 5; o++){ let n = nf(x * f + o * 17.3); if (ridged) n = 1 - Math.abs(2 * n - 1); s += n * a; tot += a; a *= 0.5; f *= 2.1; }
    return y0 - (s / tot - 0.5) * amp * 2;
  }
  // 산/언덕 한 겹. fog는 하늘색으로 아래쪽을 흐리게 만들어 거리감을 준다.
  function layer(c, o){
    const nf = noiseFn(o.seed), pts = [];
    c.beginPath(); c.moveTo(0, H);
    for (let x = 0; x <= W + 6; x += 6){ const y = ridgeY(nf, x, o.y0, o.amp, o.scale, o.ridged); pts.push([x, y]); c.lineTo(x, y); }
    c.lineTo(W, H); c.closePath();
    const gr = c.createLinearGradient(0, o.y0 - o.amp, 0, H); gr.addColorStop(0, o.top); gr.addColorStop(1, o.bot);
    c.fillStyle = gr; c.fill();
    if (o.snow){
      c.save(); c.clip();
      const sy = o.y0 - o.amp * o.snow;
      c.beginPath(); c.moveTo(0, 0);
      for (let x = 0; x <= W + 6; x += 6) c.lineTo(x, sy + (nf(x * 0.05 + 40) - 0.5) * o.amp * 0.5);
      c.lineTo(W, 0); c.closePath();
      const sg2 = c.createLinearGradient(0, o.y0 - o.amp, 0, sy + o.amp * 0.3); sg2.addColorStop(0, 'rgba(255,255,255,0.97)'); sg2.addColorStop(1, 'rgba(225,236,250,0.85)');
      c.fillStyle = sg2; c.fill(); c.restore();
    }
    if (o.fog){
      const fg = c.createLinearGradient(0, o.y0 - o.amp, 0, o.y0 + o.amp * 1.2); fg.addColorStop(0, 'rgba(' + o.fog + ',0)'); fg.addColorStop(1, 'rgba(' + o.fog + ',' + (o.fogA || 0.5) + ')');
      c.fillStyle = fg; c.fillRect(0, o.y0 - o.amp, W, o.amp * 2.4);

    return { nf, y: x => ridgeY(nf, x, o.y0, o.amp, o.scale, o.ridged) };
  }
  // 굵기가 점점 가늘어지는 굽은 가지
  function bough(c, x1, y1, cx, cy, x2, y2, w1, w2, col){
    const N = 8, L = [], R = [];
    for (let i = 0; i <= N; i++){
      const t = i / N, mt = 1 - t;
      const px = mt * mt * x1 + 2 * mt * t * cx + t * t * x2, py = mt * mt * y1 + 2 * mt * t * cy + t * t * y2;
      const dx = 2 * mt * (cx - x1) + 2 * t * (x2 - cx), dy = 2 * mt * (cy - y1) + 2 * t * (y2 - cy);
      const d = Math.hypot(dx, dy) || 1, w = (w1 + (w2 - w1) * t) / 2;
      L.push([px - dy / d * w, py + dx / d * w]); R.push([px + dy / d * w, py - dx / d * w]);
    }
    c.fillStyle = col; c.beginPath(); c.moveTo(L[0][0], L[0][1]);
    for (let i = 1; i <= N; i++) c.lineTo(L[i][0], L[i][1]);
    for (let i = N; i >= 0; i--) c.lineTo(R[i][0], R[i][1]);
    c.closePath(); c.fill();
  }
  function grow(c, x, y, ang, len, w, depth, o, r, tips){
    if (depth === 0 || len < 2){ tips.push([x, y]); return; }
    const bend = (r() - 0.5) * 0.5, a = ang + bend * 0.5;
    const x2 = x + Math.sin(a) * len, y2 = y - Math.cos(a) * len;
    const mx = x + Math.sin(ang) * len * 0.55, my = y - Math.cos(ang) * len * 0.55;
    const shade = Math.round(48 + depth * 4 + r() * 10);
    bough(c, x, y, mx, my, x2, y2, w, Math.max(0.7, w * 0.66), 'rgb(' + shade + ',' + Math.round(shade * 0.72) + ',' + Math.round(shade * 0.55) + ')');
    if (depth <= o.leafDepth) tips.push([x2, y2]);
    const n = depth > 2 && r() < o.fork3 ? 3 : 2;
    for (let i = 0; i < n; i++){
      let na = ang + (i - (n - 1) / 2) * o.spread * (0.7 + r() * 0.6) + (r() - 0.5) * 0.3;
      na *= 0.92;   // 위쪽(빛)을 향해 조금씩 곧게 자란다
      grow(c, x2, y2, na, len * (o.ratio + r() * 0.1), w * 0.66, depth - 1, o, r, tips);
    }
  }
  // 나무 한 그루: 줄기와 가지를 재귀로 뻗고, 끝마다 잎 덩어리를 어두운 층 → 밝은 층 순서로 쌓는다
  function tree(c, x, base, h, o, r){
    // 그림자
    const sh = c.createRadialGradient(x, base, 0, x, base, h * 0.45); sh.addColorStop(0, 'rgba(0,0,0,0.35)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
    c.save(); c.translate(0, base); c.scale(1, 0.14); c.translate(0, -base); c.fillStyle = sh; c.beginPath(); c.arc(x, base, h * 0.45, 0, 6.283); c.fill(); c.restore();
    const tips = [];
    // 밑동이 넓은 줄기
    bough(c, x - h * 0.012, base + 2, x, base - h * 0.1, x + h * 0.004, base - h * 0.2, h * 0.075, h * 0.05, '#3b2a1e');
    grow(c, x + h * 0.004, base - h * 0.2, o.lean || 0, h * 0.22, h * 0.05, o.depth, o, r, tips);
    const passes = [
      { cols: o.dark, rad: [0.9, 1.4], a: 0.9 },
      { cols: o.mid, rad: [0.7, 1.1], a: 0.88 },
      { cols: o.light, rad: [0.45, 0.8], a: 0.85, up: true }
    ];
    for (const p of passes){
      for (const t of tips){
        for (let i = 0; i < o.dabs; i++){
          const a = r() * 6.283, d = Math.sqrt(r()) * h * o.fr;
          const px = t[0] + Math.cos(a) * d - (p.up ? h * 0.012 : 0), py = t[1] + Math.sin(a) * d * 0.8 - (p.up ? h * 0.016 : 0);
          const rr = h * o.dab * (p.rad[0] + r() * (p.rad[1] - p.rad[0]));
          c.globalAlpha = p.a * (0.7 + r() * 0.3); c.fillStyle = p.cols[Math.floor(r() * p.cols.length)];
          c.beginPath(); c.ellipse(px, py, rr, rr * 0.8, r() * 3, 0, 6.283); c.fill();
        }

    c.globalAlpha = 1;
  }
  const OAK = (cols) => ({ depth: 7, leafDepth: 3, spread: 0.55, ratio: 0.72, fork3: 0.2, dabs: 7, fr: 0.07, dab: 0.012, dark: cols[0], mid: cols[1], light: cols[2] });
  // 소나무: 줄기에서 뻗은 가지마다 바늘잎이 촘촘히 나고, 가지 위에 눈이 덩이로 쌓인다
  function conifer(c, x, base, h, snow, r){
    if (snow){
      const sh = c.createRadialGradient(x + h * 0.08, base, 0, x + h * 0.08, base, h * 0.3); sh.addColorStop(0, 'rgba(40,70,120,0.35)'); sh.addColorStop(1, 'rgba(40,70,120,0)');
      c.save(); c.translate(0, base); c.scale(1, 0.18); c.translate(0, -base); c.fillStyle = sh; c.beginPath(); c.arc(x + h * 0.08, base, h * 0.3, 0, 6.283); c.fill(); c.restore();
    }
    bough(c, x - h * 0.018, base + 1, x, base - h * 0.25, x + h * 0.003, base - h * 0.5, h * 0.04, h * 0.012, '#2e2018');
    const tiers = 13;
    for (let i = 0; i < tiers; i++){
      const t = i / (tiers - 1), y = base - h * 0.1 - t * h * 0.86, reach = (1 - t) * h * 0.2 + h * 0.014;
      for (let s = -1; s <= 1; s += 2){
        for (let k = 0; k < 6; k++){
          const len = reach * (0.45 + 0.55 * r()), dr = 0.28 + r() * 0.3, yy = y + (r() - 0.5) * h * 0.035;
          const ex = x + s * len, ey = yy + len * dr, cx = x + s * len * 0.5, cy = yy + len * dr * 0.1;
          c.strokeStyle = 'hsl(' + (150 + r() * 12) + ',' + (35 + r() * 10) + '%,' + (12 + r() * 6) + '%)'; c.lineWidth = Math.max(1, h * 0.008); c.lineCap = 'round';
          c.beginPath(); c.moveTo(x, yy); c.quadraticCurveTo(cx, cy, ex, ey); c.stroke();
          const nl = Math.max(3, h * (0.035 - t * 0.012));
          for (let j = 1; j <= 9; j++){
            const u = j / 9, mu = 1 - u, px = mu * mu * x + 2 * mu * u * cx + u * u * ex, py = mu * mu * yy + 2 * mu * u * cy + u * u * ey;
            c.strokeStyle = 'hsl(' + (148 + r() * 16) + ',' + (38 + r() * 14) + '%,' + (14 + r() * 12 + u * 5) + '%)'; c.lineWidth = 1.3;
            c.beginPath(); c.moveTo(px, py); c.lineTo(px + s * nl * 0.35, py + nl * (0.9 + r() * 0.4)); c.moveTo(px, py); c.lineTo(px - s * nl * 0.3, py + nl * (0.7 + r() * 0.4)); c.stroke();
          }
          if (snow){
            for (let j = 1; j <= 5; j++){
              const u = j / 6 + (r() - 0.5) * 0.08, mu = 1 - u, px = mu * mu * x + 2 * mu * u * cx + u * u * ex, py = mu * mu * yy + 2 * mu * u * cy + u * u * ey - h * 0.004;
              c.fillStyle = 'rgba(' + (232 + Math.round(r() * 20)) + ',' + (242 + Math.round(r() * 10)) + ',255,' + (0.7 + r() * 0.25) + ')';
              c.beginPath(); c.ellipse(px, py, Math.max(1.5, len * 0.1), Math.max(1, len * 0.045), 0.15 * s, 0, 6.283); c.fill();
            }
          }
        }
      }
    }
    for (let k = 0; k < 18; k++){
      const a = (r() - 0.5) * 1.6, L = h * (0.03 + r() * 0.04), ax = x, ay = base - h * 0.95;
      c.strokeStyle = 'hsl(' + (150 + r() * 10) + ',40%,' + (14 + r() * 8) + '%)'; c.lineWidth = 1.3;
      c.beginPath(); c.moveTo(ax, ay + h * 0.06); c.lineTo(ax + Math.sin(a) * L, ay - Math.cos(a) * L + h * 0.04); c.stroke();
    }
    if (snow){ c.fillStyle = 'rgba(240,247,255,0.95)'; c.beginPath(); c.ellipse(x, base - h * 0.97, h * 0.012, h * 0.03, 0, 0, 6.283); c.fill(); }
  }
  function palm(c, x, base, h, r){
    // 줄기: 살짝 굽고 마디가 있다
    const tx = x + h * 0.2, ty = base - h, cx = x + h * 0.02, cy = base - h * 0.55;
    bough(c, x, base, cx, cy, tx, ty, h * 0.07, h * 0.04, '#6b4a30');
    c.strokeStyle = 'rgba(40,25,15,0.45)'; c.lineWidth = 1;
    for (let i = 1; i < 18; i++){
      const t = i / 18, mt = 1 - t, px = mt * mt * x + 2 * mt * t * cx + t * t * tx, py = mt * mt * base + 2 * mt * t * cy + t * t * ty, w = (h * 0.07 + (h * 0.04 - h * 0.07) * t) / 2;
      c.beginPath(); c.moveTo(px - w, py); c.lineTo(px + w, py + 2); c.stroke();
    }
    // 잎: 휘어진 줄기에 작은 잎살이 빗살처럼 붙는다
    for (let i = 0; i < 11; i++){
      const a = -Math.PI * 1.05 + i * (Math.PI * 1.1 / 10) + (r() - 0.5) * 0.15, len = h * (0.36 + r() * 0.12);
      const ex = tx + Math.cos(a) * len, ey = ty + Math.sin(a) * len * 0.35 + len * 0.42, ccx = tx + Math.cos(a) * len * 0.55, ccy = ty + Math.sin(a) * len * 0.55 - len * 0.12;
      c.strokeStyle = '#1a6a42'; c.lineWidth = 2; c.beginPath(); c.moveTo(tx, ty); c.quadraticCurveTo(ccx, ccy, ex, ey); c.stroke();
      for (let k = 2; k <= 15; k++){

    c.fillStyle = '#4a321f'; for (let i = 0; i < 3; i++){ c.beginPath(); c.arc(tx + (i - 1) * h * 0.02, ty + h * 0.02, h * 0.018, 0, 6.283); c.fill(); }
  }
  function grass(c, y0, y1, n, hues, r, len){
    for (let i = 0; i < n; i++){
      const x = r() * W, y = y0 + r() * (y1 - y0), L = len * (0.5 + r() * 0.9), lean = (r() - 0.5) * len * 0.5;
      c.strokeStyle = 'hsl(' + (hues[0] + r() * hues[1]) + ',' + (45 + r() * 25) + '%,' + (22 + r() * 22) + '%)'; c.lineWidth = 1 + r() * 0.8;

  function cloud(c, x, y, s, a, tint){

      const gr = c.createRadialGradient(cx, cy - rr * 0.2, 0, cx, cy, rr);

    }
  }

  // ----- 풍경(크기가 바뀔 때만 한 번 그린다) -----
  let glints = [], chimney = null;
  function buildScene(){
    scene.width = cv.width; scene.height = cv.height;
    sg.setTransform(D, 0, 0, D, 0, 0); sg.clearRect(0, 0, W, H);
    const r = lcg(season.charCodeAt(0) * 977), hz = H * 0.7, base = Math.min(W, H);
    glints = []; chimney = null;
    if (season === 'summer'){
      layer(sg, { seed: 5, y0: hz - 6, amp: 26, scale: 0.006, ridged: true, top: 'rgba(52,120,140,0.9)', bot: 'rgba(52,120,140,0.9)', fog: '150,215,225', fogA: 0.7 });
      const sea = sg.createLinearGradient(0, hz, 0, H); sea.addColorStop(0, '#2fb5cc'); sea.addColorStop(0.45, '#0e7b9c'); sea.addColorStop(1, '#05344d');
      sg.fillStyle = sea; sg.fillRect(0, hz, W, H - hz);
      const hg = sg.createLinearGradient(0, hz - 30, 0, hz + 16); hg.addColorStop(0, 'rgba(255,255,255,0)'); hg.addColorStop(0.75, 'rgba(255,255,255,0.4)'); hg.addColorStop(1, 'rgba(255,255,255,0)');
      sg.fillStyle = hg; sg.fillRect(0, hz - 30, W, 46);
      for (let i = 0; i < 26; i++){
        const k = i / 25, y = hz + (H - hz) * Math.pow(k, 1.7) + 6;
        sg.strokeStyle = 'rgba(255,255,255,' + (0.05 + 0.13 * k) + ')'; sg.lineWidth = 0.8 + k * 1.8;
        sg.beginPath(); for (let x = 0; x <= W; x += 8) sg.lineTo(x, y + Math.sin(x * (0.03 - k * 0.012) + i * 2.1) * (0.8 + k * 3.4)); sg.stroke();
      }
      for (let i = 0; i < 70; i++){ const k = Math.pow(r(), 1.4); glints.push({ x: W * 0.8 + (r() - 0.5) * (30 + k * W * 0.3), y: hz + 6 + k * (H - hz - 40), w: 4 + r() * 16 * (0.4 + k), ph: r() * 6.28 }); }
      layer(sg, { seed: 9, y0: H * 0.945, amp: 14, scale: 0.01, top: '#f0d9a2', bot: '#b48c52' });
      palm(sg, W * 0.09, H * 0.97, Math.min(H * 0.4, 330), r);
      palm(sg, W * 0.93, H * 0.985, Math.min(H * 0.3, 250), r);
    } else if (season === 'spring'){
      layer(sg, { seed: 3, y0: H * 0.56, amp: 60, scale: 0.0035, ridged: true, top: 'rgba(120,130,175,0.85)', bot: 'rgba(120,130,175,0.85)', fog: '240,190,205', fogA: 0.7 });
      layer(sg, { seed: 4, y0: H * 0.64, amp: 34, scale: 0.005, top: 'rgba(110,160,150,0.9)', bot: 'rgba(80,130,110,0.9)', fog: '240,200,210', fogA: 0.55 });
      const cherryO = { depth: 7, leafDepth: 3, spread: 0.6, ratio: 0.74, fork3: 0.3, dabs: 9, fr: 0.06, dab: 0.011, dark: ['#d9779e', '#c9638c'], mid: ['#f39bbb', '#ee86ab', '#f7b0c8'], light: ['#ffd7e5', '#ffe9f1', '#ffc2d7'] };
      layer(sg, { seed: 6, y0: H * 0.74, amp: 26, scale: 0.007, top: '#6fb06a', bot: '#3d7f48', fog: '230,215,215', fogA: 0.3 });
      tree(sg, W * 0.8, H * 0.8, Math.min(H * 0.42, 360), Object.assign({ lean: -0.05 }, cherryO), r);
      layer(sg, { seed: 7, y0: H * 0.86, amp: 18, scale: 0.01, top: '#4d9a52', bot: '#245c33' });
      tree(sg, W * 0.1, H * 0.93, Math.min(H * 0.5, 440), Object.assign({ lean: 0.06 }, cherryO), r);
      layer(sg, { seed: 8, y0: H * 0.95, amp: 8, scale: 0.014, top: '#3d8a48', bot: '#15401f' });
      grass(sg, H * 0.93, H, 520, [85, 45], r, 18);
      for (let i = 0; i < 90; i++){ sg.fillStyle = ['#ffffff', '#ffd1e6', '#fff2a8', '#ffb3d1'][Math.floor(r() * 4)]; sg.beginPath(); sg.arc(r() * W, H * 0.94 + r() * H * 0.06, 1.2 + r() * 1.8, 0, 6.283); sg.fill(); }
    } else if (season === 'autumn'){
      layer(sg, { seed: 11, y0: H * 0.58, amp: 56, scale: 0.0035, ridged: true, top: 'rgba(130,80,80,0.9)', bot: 'rgba(130,80,80,0.9)', fog: '235,170,110', fogA: 0.75 });
      const warm = [['#7a3412', '#8e3f14'], ['#b8561a', '#c9651e', '#a24a14'], ['#f0a53a', '#e3892a', '#ffc65a']];
      const forest = (y, n, hmin, hmax, fogA) => { for (let i = 0; i < n; i++) tree(sg, W * (i + r() * 0.8) / n, y + r() * H * 0.02, H * (hmin + r() * (hmax - hmin)), Object.assign(OAK(warm), { depth: 6, dabs: 5, lean: (r() - 0.5) * 0.1 }), r); };
      layer(sg, { seed: 12, y0: H * 0.7, amp: 18, scale: 0.007, top: '#8b4a2a', bot: '#6a3520', fog: '230,150,100', fogA: 0.5 });
      forest(H * 0.74, 9, 0.12, 0.18);
      sg.fillStyle = 'rgba(240,170,110,0.28)'; sg.fillRect(0, H * 0.66, W, H * 0.1);
      layer(sg, { seed: 13, y0: H * 0.82, amp: 16, scale: 0.009, top: '#7a4220', bot: '#3f2110' });
      forest(H * 0.86, 5, 0.22, 0.3);
      layer(sg, { seed: 14, y0: H * 0.94, amp: 8, scale: 0.013, top: '#5d3416', bot: '#26140a' });
      tree(sg, W * 0.86, H * 0.97, Math.min(H * 0.55, 480), Object.assign(OAK(warm), { lean: -0.08 }), r);
      tree(sg, W * 0.09, H * 0.98, Math.min(H * 0.46, 400), Object.assign(OAK(warm), { lean: 0.07 }), r);
      grass(sg, H * 0.945, H, 300, [28, 22], r, 15);
      const lc = ['#e8791d', '#d1451b', '#f2b134', '#b23a14', '#f4c04a'];
      for (let i = 0; i < 110; i++){ sg.save(); sg.translate(r() * W, H * 0.94 + r() * H * 0.06); sg.rotate(r() * 6.28); sg.fillStyle = lc[Math.floor(r() * 5)]; sg.beginPath(); sg.ellipse(0, 0, 3.5 + r() * 4, 1.8 + r() * 2, 0, 0, 6.283); sg.fill(); sg.restore(); }
    } else {

      layer(sg, { seed: 22, y0: H * 0.62, amp: 52, scale: 0.0045, ridged: true, top: '#9db3d6', bot: '#6a86b3', snow: 0.3, fog: '90,125,180', fogA: 0.55 });
      layer(sg, { seed: 23, y0: H * 0.72, amp: 22, scale: 0.007, top: '#cfdcee', bot: '#9fb5d2', fog: '120,150,200', fogA: 0.4 });
      for (let i = 0; i < 12; i++) conifer(sg, W * (i + r() * 0.8) / 12, H * (0.76 + r() * 0.02), H * (0.1 + r() * 0.05), true, r);
      layer(sg, { seed: 24, y0: H * 0.82, amp: 16, scale: 0.008, top: '#e4edf8', bot: '#aebfd8' });
      const cx = W * 0.8, cy = H * 0.875, w = Math.min(W * 0.15, 130);
      sg.fillStyle = '#5a4034'; sg.fillRect(cx + w * 0.22, cy - w * 0.95, w * 0.14, w * 0.5);
      sg.fillStyle = '#4a3226'; sg.fillRect(cx - w / 2, cy - w * 0.45, w, w * 0.45);
      sg.strokeStyle = 'rgba(30,18,12,0.5)'; sg.lineWidth = 1; for (let i = 1; i < 6; i++){ sg.beginPath(); sg.moveTo(cx - w / 2, cy - w * 0.45 + i * w * 0.075); sg.lineTo(cx + w / 2, cy - w * 0.45 + i * w * 0.075); sg.stroke(); }
      const wg = sg.createRadialGradient(cx, cy - w * 0.22, 0, cx, cy - w * 0.22, w * 0.55); wg.addColorStop(0, 'rgba(255,200,90,0.6)'); wg.addColorStop(1, 'rgba(255,200,90,0)');
      sg.fillStyle = wg; sg.fillRect(cx - w, cy - w, w * 2, w * 1.2);
      sg.fillStyle = '#ffd36b'; sg.fillRect(cx - w * 0.13, cy - w * 0.32, w * 0.26, w * 0.2);
      sg.fillStyle = '#f2f8fd'; sg.beginPath(); sg.moveTo(cx - w * 0.64, cy - w * 0.43); sg.lineTo(cx, cy - w * 0.95); sg.lineTo(cx + w * 0.64, cy - w * 0.43); sg.quadraticCurveTo(cx, cy - w * 0.5, cx - w * 0.64, cy - w * 0.43); sg.fill();
      layer(sg, { seed: 25, y0: H * 0.92, amp: 10, scale: 0.011, top: '#f4f9fd', bot: '#bccde2' });
      const fh1 = Math.min(H * 0.42, 360, W * 0.55), fh2 = Math.min(H * 0.3, 260, W * 0.4);
      conifer(sg, fh1 * 0.24 + 6, H * 0.97, fh1, true, r);
      conifer(sg, fh1 * 0.5 + fh2 * 0.26 + 14, H * 0.985, fh2, true, r);
      chimney = { x: cx + w * 0.3, y: cy - w * 0.88, w: w };
      for (let i = 0; i < 120; i++){ sg.fillStyle = 'rgba(255,255,255,' + (0.4 + r() * 0.5) + ')'; sg.beginPath(); sg.arc(r() * W, H * 0.9 + r() * H * 0.1, 0.6 + r() * 1.1, 0, 6.283); sg.fill(); }
    }
    const vg = sg.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.35, W / 2, H * 0.55, Math.max(W, H) * 0.85); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,10,0.38)');
    sg.fillStyle = vg; sg.fillRect(0, 0, W, H);
    // 위쪽을 어둡게 눌러 제목과 버튼 글자가 잘 보이게 한다
    const ov = sg.createLinearGradient(0, 0, 0, H * 0.62); ov.addColorStop(0, 'rgba(5,8,20,0.55)'); ov.addColorStop(1, 'rgba(5,8,20,0)');
    sg.fillStyle = ov; sg.fillRect(0, 0, W, H);

  // ----- 떨어지는 것들의 모양 -----
  function petal(c, s, flip){
    c.scale(Math.max(0.25, Math.abs(flip)), 1);
    const gr = c.createLinearGradient(0, -s, 0, s); gr.addColorStop(0, '#ffe3ee'); gr.addColorStop(1, '#ff9fc2');
    c.fillStyle = gr; c.beginPath();
    c.moveTo(0, s); c.bezierCurveTo(-s * 1.1, s * 0.3, -s * 0.9, -s * 0.9, -s * 0.14, -s); c.lineTo(0, -s * 0.76); c.lineTo(s * 0.14, -s);
    c.bezierCurveTo(s * 0.9, -s * 0.9, s * 1.1, s * 0.3, 0, s); c.fill();
  }
  const MAPLE = [[0, -1], [0.14, -0.62], [0.42, -0.78], [0.36, -0.3], [0.9, -0.4], [0.62, 0], [0.84, 0.3], [0.3, 0.22], [0.1, 0.62]];
  function leaf(c, s, col, kind, flip){
    c.scale(Math.max(0.3, Math.abs(flip)), 1);
    c.fillStyle = col; c.beginPath();
    if (kind){
      c.moveTo(0, -s); MAPLE.forEach(p => c.lineTo(p[0] * s, p[1] * s)); c.lineTo(0, s * 0.78);
      for (let i = MAPLE.length - 1; i >= 0; i--) c.lineTo(-MAPLE[i][0] * s, MAPLE[i][1] * s);
    } else {
      c.moveTo(0, -s); c.bezierCurveTo(s * 0.9, -s * 0.5, s * 0.8, s * 0.5, 0, s * 0.8); c.bezierCurveTo(-s * 0.8, s * 0.5, -s * 0.9, -s * 0.5, 0, -s);
    }
    c.fill();
    c.strokeStyle = 'rgba(70,25,5,0.55)'; c.lineWidth = Math.max(0.8, s * 0.07);
    c.beginPath(); c.moveTo(0, -s * 0.8); c.lineTo(0, s * 1.05); c.stroke();
  }
  function flake(c, r){
    if (r < 2.6){
      const gr = c.createRadialGradient(0, 0, 0, 0, 0, r * 1.8); gr.addColorStop(0, 'rgba(255,255,255,0.95)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = gr; c.beginPath(); c.arc(0, 0, r * 1.8, 0, 6.283); c.fill(); return;
    }
    c.strokeStyle = 'rgba(255,255,255,0.9)'; c.lineWidth = 1; c.lineCap = 'round';
    const L = r * 2.2;
    for (let i = 0; i < 6; i++){

      c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -L); c.moveTo(0, -L * 0.55); c.lineTo(-L * 0.28, -L * 0.8); c.moveTo(0, -L * 0.55); c.lineTo(L * 0.28, -L * 0.8); c.stroke();

  function gull(c, x, y, s, t){
    const f = Math.sin(t / 220) * s * 0.35;

    c.beginPath(); c.moveTo(x - s, y - f); c.quadraticCurveTo(x - s * 0.4, y - s * 0.45 - f, x, y); c.quadraticCurveTo(x + s * 0.4, y - s * 0.45 - f, x + s, y - f); c.stroke();
  }

  // ----- 움직이는 것들 -----
  function make(){
    const n = Math.max(22, Math.min(60, Math.round(W * H / 26000)));
    parts = [];
    for (let i = 0; i < n; i++){
      const p = { x: rnd(0, W), y: rnd(0, H), ph: rnd(0, 6.28), rot: rnd(0, 6.28), vr: rnd(-1.2, 1.2), tum: rnd(0, 6.28), tv: rnd(1.5, 3.5) };
      if (season === 'summer'){ p.r = rnd(1.5, 3.2); p.vy = -rnd(8, 22); p.a = rnd(0.35, 0.8); }
      else if (season === 'spring'){ p.s = rnd(5, 8); p.vy = rnd(24, 44); }
      else if (season === 'autumn'){ p.s = rnd(8, 13); p.vy = rnd(34, 62); p.c = ['#e8791d', '#d1451b', '#f2b134', '#b23a14'][i % 4]; p.k = i % 3 === 0 ? 0 : 1; }
      else { p.r = rnd(1.2, 4.4); p.vy = rnd(16, 46); }
      parts.push(p);
    }
    clouds = [];
    for (let i = 0; i < 5; i++) clouds.push({ x: rnd(0, W), y: rnd(H * 0.06, H * 0.34), s: rnd(50, 110), v: rnd(4, 11) });
    stars = [];
    for (let i = 0; i < 90; i++) stars.push({ x: rnd(0, W), y: rnd(0, H * 0.55), r: rnd(0.4, 1.4), ph: rnd(0, 6.28) });
    gulls = [];
    for (let i = 0; i < 3; i++) gulls.push({ x: rnd(0, W), y: rnd(H * 0.12, H * 0.4), s: rnd(7, 12), v: rnd(18, 32) });
  }
  function sky(t){
    if (season === 'summer'){
      const sx = W * 0.8, sy = H * 0.18;
      const gl = g.createRadialGradient(sx, sy, 0, sx, sy, Math.max(220, W * 0.4)); gl.addColorStop(0, 'rgba(255,236,160,0.6)'); gl.addColorStop(1, 'rgba(255,236,160,0)');
      g.fillStyle = gl; g.fillRect(0, 0, W, H);
      g.save(); g.translate(sx, sy); g.rotate(t / 20000);
      for (let i = 0; i < 12; i++){ g.rotate(Math.PI / 6); g.fillStyle = 'rgba(255,240,180,0.07)'; g.beginPath(); g.moveTo(0, 0); g.lineTo(-18, -Math.max(W, H)); g.lineTo(18, -Math.max(W, H)); g.fill(); }
      g.restore();
      g.fillStyle = '#fff7cf'; g.beginPath(); g.arc(sx, sy, 34, 0, 6.283); g.fill();
    } else if (season === 'autumn'){
      const sx = W * 0.68, sy = H * 0.66;
      const gl = g.createRadialGradient(sx, sy, 0, sx, sy, Math.max(260, W * 0.5)); gl.addColorStop(0, 'rgba(255,170,70,0.7)'); gl.addColorStop(1, 'rgba(255,170,70,0)');
      g.fillStyle = gl; g.fillRect(0, 0, W, H);
      g.fillStyle = 'rgba(255,214,140,0.9)'; g.beginPath(); g.arc(sx, sy, 40, 0, 6.283); g.fill();
    } else if (season === 'winter'){
      for (let k = 0; k < 3; k++){
        const yy = H * (0.2 + k * 0.07), ag = g.createLinearGradient(0, yy - 60, 0, yy + 60); ag.addColorStop(0, 'rgba(80,255,170,0)'); ag.addColorStop(0.5, 'rgba(80,255,170,' + (0.09 + 0.04 * Math.sin(t / 2500 + k)) + ')'); ag.addColorStop(1, 'rgba(120,120,255,0)');
        g.fillStyle = ag; g.beginPath(); g.moveTo(0, yy);
        for (let x = 0; x <= W; x += 20) g.lineTo(x, yy + Math.sin(x / 140 + t / 3000 + k * 2) * 26);
        g.lineTo(W, yy + 80); g.lineTo(0, yy + 80); g.closePath(); g.fill();
      }
      for (const s of stars){ g.fillStyle = 'rgba(255,255,255,' + (0.35 + 0.5 * Math.abs(Math.sin(t / 900 + s.ph))) + ')'; g.beginPath(); g.arc(s.x, s.y, s.r, 0, 6.283); g.fill(); }
      const mx = W * 0.8, my = H * 0.16;
      const gl = g.createRadialGradient(mx, my, 0, mx, my, 130); gl.addColorStop(0, 'rgba(210,225,255,0.45)'); gl.addColorStop(1, 'rgba(210,225,255,0)');
      g.fillStyle = gl; g.fillRect(mx - 140, my - 140, 280, 280);
      g.fillStyle = '#f2f6ff'; g.beginPath(); g.arc(mx, my, 26, 0, 6.283); g.fill();
      g.fillStyle = 'rgba(160,175,205,0.35)'; for (const c of [[-8, -6, 6], [7, 5, 5], [-3, 10, 3.5]]){ g.beginPath(); g.arc(mx + c[0], my + c[1], c[2], 0, 6.283); g.fill(); }
    }
    if (season !== 'winter'){
      const tint = season === 'spring' ? '255,225,235' : season === 'autumn' ? '255,215,170' : '255,255,255';
      for (const c of clouds) cloud(g, c.x, c.y, c.s, season === 'summer' ? 0.5 : 0.32, tint);
    }
  }
  function drawParts(t){
    for (const p of parts){
      const x = p.x + Math.sin(t / 1300 + p.ph) * 20;
      g.save(); g.translate(x, p.y); g.rotate(p.rot);
      const flip = Math.cos(p.tum + t / 1000 * p.tv);
      if (season === 'summer'){
        g.rotate(-p.rot);
        const gr = g.createRadialGradient(0, 0, 0, 0, 0, p.r * 2.4); gr.addColorStop(0, 'rgba(255,248,200,' + p.a + ')'); gr.addColorStop(1, 'rgba(255,248,200,0)');
        g.fillStyle = gr; g.beginPath(); g.arc(0, 0, p.r * 2.4, 0, 6.283); g.fill();
      } else if (season === 'spring') petal(g, p.s, flip);
      else if (season === 'autumn') leaf(g, p.s, p.c, p.k, flip);
      else flake(g, p.r);
      g.restore();
    }
    if (chimney){
      for (let k = 0; k < 7; k++){
        const u = ((t / 3200) + k / 7) % 1, px = chimney.x + u * chimney.w * 0.6 + Math.sin(u * 7 + k) * 4, py = chimney.y - u * chimney.w * 1.3, rr = 3 + u * 11;
        g.fillStyle = 'rgba(225,233,246,' + ((1 - u) * 0.32) + ')'; g.beginPath(); g.arc(px, py, rr, 0, 6.283); g.fill();
      }
    }
    if (season === 'summer'){
      for (const s of glints){ g.fillStyle = 'rgba(255,248,210,' + (0.15 + 0.55 * Math.max(0, Math.sin(t / 500 + s.ph))) + ')'; g.fillRect(s.x, s.y, s.w, 1.4); }
      for (const b of gulls) gull(g, b.x, b.y, b.s, t);
    }
  }
  function frame(t){
    g.clearRect(0, 0, W, H);
    sky(t);
    g.drawImage(scene, 0, 0, W, H);
    drawParts(t);
  }
  function step(t){
    raf = requestAnimationFrame(step);
    if (t - last < 33) return;
    const dt = Math.min(0.1, (t - last) / 1000); last = t;
    for (const p of parts){
      p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.vy > 0 && p.y > H + 24){ p.y = -24; p.x = rnd(0, W); }
      if (p.vy < 0 && p.y < -24){ p.y = H + 24; p.x = rnd(0, W); }
    }
    for (const c of clouds){ c.x += c.v * dt; if (c.x - c.s * 2 > W) c.x = -c.s * 2; }
    for (const b of gulls){ b.x += b.v * dt; if (b.x > W + 30) b.x = -30; }
    frame(t);
  }
  function resize(){
    D = Math.min(window.devicePixelRatio || 1, 2); W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * D); cv.height = Math.round(H * D);
    g.setTransform(D, 0, 0, D, 0, 0);
    buildScene();
  }
  function set(s){
    season = s;
    const c = SKY[s];
    document.body.style.background = 'linear-gradient(180deg,' + c[0] + ',' + c[1] + ' 55%,' + c[2] + ') fixed';
    document.body.style.backgroundColor = c[1];
    resize(); make();
    cancelAnimationFrame(raf);
    if (reduce) frame(0); else { last = 0; raf = requestAnimationFrame(step); }
  }
  window.addEventListener('resize', () => { resize(); make(); if (reduce) frame(0); });
  return { set };
})();

// ---------------- 배경음악 (직접 만든 곡을 브라우저에서 소리로 합성한다. 외부 음원이 없어 저작권 문제가 없다) ----------------
const Music = (() => {
  const CFG = {
    easy:    { bpm: 108, root: 60, scale: [0, 2, 4, 7, 9], chords: [[0, 'M'], [5, 'M'], [7, 'M'], [5, 'M']], dens: 0.72, oct: 12, lead: 'triangle', bass: 'sine', tick: true, wet: 0.22 },
    normal:  { bpm: 88, root: 62, scale: [0, 2, 4, 7, 9], chords: [[0, 'M'], [7, 'M'], [9, 'm'], [5, 'M']], dens: 0.5, oct: 12, lead: 'sine', bass: 'sine', bell: true, wet: 0.35 },
    hard:    { bpm: 76, root: 57, scale: [0, 3, 5, 7, 10], chords: [[0, 'm'], [8, 'M'], [3, 'M'], [10, 'M']], dens: 0.5, oct: 12, lead: 'triangle', bass: 'sawtooth', wet: 0.3 },
    extreme: { bpm: 60, root: 64, scale: [0, 3, 5, 7, 10], chords: [[0, 'm'], [8, 'M'], [5, 'M'], [10, 'M']], dens: 0.33, oct: 24, lead: 'sine', bass: 'sine', bell: true, drone: true, wet: 0.5 }
  };
  const TRIAD = { M: [0, 4, 7], m: [0, 3, 7] };
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function bus(ctx, out, cfg){
    const input = ctx.createGain(), dry = ctx.createGain(), send = ctx.createGain();
    const dl = ctx.createDelay(1), fb = ctx.createGain(), lp = ctx.createBiquadFilter();
    dry.gain.value = 1; send.gain.value = cfg.wet; dl.delayTime.value = 30 / cfg.bpm * 3; fb.gain.value = 0.42;
    lp.type = 'lowpass'; lp.frequency.value = 2400;
    input.connect(dry); dry.connect(out);
    input.connect(send); send.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(out);
    return { input };
  }
  function tone(ctx, b, type, f, t, dur, vol, att, filt){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + att);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let n = o;
    if (filt){ const q = ctx.createBiquadFilter(); q.type = 'lowpass'; q.frequency.value = filt; o.connect(q); n = q; }
    n.connect(g); g.connect(b.input);
    o.start(t); o.stop(t + dur + 0.05);
  }
  let noiseBuf = null;
  function noise(ctx, b, t, vol){
    if (!noiseBuf){ noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.08, ctx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = ctx.createBufferSource(), g = ctx.createGain(), h = ctx.createBiquadFilter();
    s.buffer = noiseBuf; h.type = 'highpass'; h.frequency.value = 6000;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    s.connect(h); h.connect(g); g.connect(b.input); s.start(t);
  }
  // 한 박자(8분음표) 분량을 예약한다. step은 0부터 올라간다. 네 마디(32스텝)가 한 바퀴.
  function schedule(ctx, b, cfg, step, t, st){
    const sd = 30 / cfg.bpm, bar = Math.floor(step / 8) % 4, ch = cfg.chords[bar], base = cfg.root + ch[0];
    if (step % 8 === 0){
      TRIAD[ch[1]].forEach((iv, i) => tone(ctx, b, 'sine', mtof(base + 12 + iv), t, sd * 8 * 0.98, 0.035, 0.7 + i * 0.08));
    }
    if (step % 4 === 0) tone(ctx, b, cfg.bass, mtof(base - 12), t, sd * 3, cfg.bass === 'sawtooth' ? 0.07 : 0.11, 0.02, cfg.bass === 'sawtooth' ? 420 : 0);
    if (cfg.tick && step % 2 === 1) noise(ctx, b, t, 0.025);
    if (cfg.drone && step % 32 === 0){
      tone(ctx, b, 'sine', mtof(cfg.root - 24), t, sd * 32, 0.05, 2.5);
      tone(ctx, b, 'sine', mtof(cfg.root - 24 + 7), t, sd * 32, 0.03, 3);
    }
    if (Math.random() < cfg.dens){
      const n = cfg.scale.length;
      st.pos = Math.max(0, Math.min(n * 2 - 1, st.pos + [-2, -1, -1, 0, 1, 1, 2][Math.floor(Math.random() * 7)]));
      const m = cfg.root + cfg.scale[st.pos % n] + 12 * Math.floor(st.pos / n) + cfg.oct - 12;
      const dur = sd * (1 + Math.floor(Math.random() * 3));
      tone(ctx, b, cfg.lead, mtof(m), t, dur * 1.6, 0.09, 0.012);
      if (cfg.bell) tone(ctx, b, 'sine', mtof(m) * 2.01, t, dur, 0.025, 0.008);
    }
  }
  // 소리 파일을 만들 때나 시험할 때 쓴다: 지정한 초만큼 미리 예약한다.
  function renderSchedule(ctx, mode, seconds){
    const cfg = CFG[mode], out = ctx.createGain(), comp = ctx.createDynamicsCompressor();
    out.gain.value = 1.0; out.connect(comp); comp.connect(ctx.destination);
    const b = bus(ctx, out, cfg), st = { pos: 3 }, sd = 30 / cfg.bpm;
    for (let s = 0, t = 0; t < seconds; s++, t += sd) schedule(ctx, b, cfg, s, t, st);
  }

  let ctx = null, master = null, sfxOut = null, cur = null, timer = 0, step = 0, nextT = 0, mode = 'easy', want = false, st = { pos: 3 };
  const btn = document.getElementById('musicBtn');
  function paint(){ if (btn){ btn.setAttribute('aria-pressed', want ? 'true' : 'false'); btn.textContent = want ? '♪ 소리 켬' : '♪ 소리 끔'; } }
  function ensure(){
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0;
    const comp = ctx.createDynamicsCompressor();
    master.connect(comp); comp.connect(ctx.destination);
    sfxOut = ctx.createGain(); sfxOut.gain.value = 0.9; sfxOut.connect(comp);
    return true;
  }
  function loop(){
    const cfg = CFG[mode], sd = 30 / cfg.bpm;
    while (nextT < ctx.currentTime + 0.5){ schedule(ctx, cur, cfg, step, nextT, st); nextT += sd; step++; }
  }
  function begin(){

    if (!fixed) c = paths.findIndex((_, k) => !isComplete(k));
    if (c === -1) return;
    hintUsed[levelIdx] = (hintUsed[levelIdx] || 0) + 1;
    const line = sol[c].slice();
    paths[c] = line;
    // 정답 선이 지나가는 칸을 차지하고 있던 다른 선은 그 칸 앞에서 잘라 절대 겹치지 않게 한다
    const on = new Set(line);
    paths.forEach((p, k) => { if (k !== c){ const j = p.findIndex(x => on.has(x)); if (j !== -1) paths[k] = p.slice(0, j); } });
    moves++; fxRing(sol[c][0], COLORS[c % COLORS.length], true); fxRing(sol[c][sol[c].length - 1], COLORS[c % COLORS.length], true); Sfx.hint(); buzz(10);
    checkWin(); draw(); updateUI();
    if (!solved) $('msg').textContent = fixed ? '잘못 그은 선을 고쳤어요' : '선 하나를 이어 줬어요';
  };
  $('reset').onclick = () => load(levelIdx);
  $('prev').onclick = () => load(levelIdx - 1);
  $('next').onclick = () => { if (solved || levelIdx < unlocked) load(levelIdx + 1); };
  function buildSelect(){
    const box = $('grid'); box.textContent = '';
    for (let i = 0; i < TOTAL; i++){
      const b = document.createElement('button');
      b.textContent = i + 1;
      b.className = 'k' + stageParams(i).kind + (i === levelIdx ? ' cur' : '') + (i < unlocked ? ' done' : '');
      b.disabled = i > unlocked;
      b.onclick = () => { load(i); $('sel').hidden = true; };
      box.appendChild(b);
    }
  }
  $('pick').onclick = () => { const s = $('sel'); s.hidden = !s.hidden; if (!s.hidden){ buildSelect(); const c = $('grid').children[levelIdx]; if (c) c.scrollIntoView({block:'center'}); } };
  document.addEventListener('pointerdown', e => {
    const b = e.target.closest && e.target.closest('button');
    if (!b || b.disabled) return;
    Sfx.click(); buzz(6);
    if (reduceFx) return;
    const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2, sp = document.createElement('span');
    sp.className = 'rip'; sp.style.cssText = 'width:' + d + 'px;height:' + d + 'px;left:' + (e.clientX - r.left - d / 2) + 'px;top:' + (e.clientY - r.top - d / 2) + 'px';
    b.appendChild(sp); setTimeout(() => sp.remove(), 520);
  });
  // ---------------- 계정 ----------------
  let db = null, account = null;   // account = { key, name, hash }
  const AUTO = 'dotsAuto';
  const enc = new TextEncoder();
  const hex = u8 => Array.from(u8).map(b => b.toString(16).padStart(2, '0')).join('');
  const keyOf = name => 'u' + hex(enc.encode(name.toLowerCase()));
  function cheapHash(str){
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57, out = '';
    for (let r = 0; r < 4000; r++)
      for (let i = 0; i < str.length; i++){
        const ch = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677);
      }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    out = (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
    return out;
  }
  async function hashPw(name, pw, salt){
    if (!(window.crypto && crypto.subtle)) return 'c' + cheapHash(salt + name.toLowerCase() + pw);
    const k = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode(salt + name.toLowerCase()), iterations: 100000 }, k, 256);
    return hex(new Uint8Array(bits));
  }
  function saveProgress(v){
    if (!account || !db) return;
    db.doc('accounts/' + account.key).update({ ['prog_' + MODE]: v }).catch(() => { $('msg').textContent = '진행 저장에 실패했어요'; });
  }
  function setAuto(on){
    try {
      if (on && account) localStorage.setItem(AUTO, JSON.stringify({ key: account.key, hash: account.hash }));
      else localStorage.removeItem(AUTO);
    } catch (e) {}
  }
  function autoOn(){ try { return !!localStorage.getItem(AUTO); } catch (e) { return false; } }
  function renderAcct(){
    const out = !account;
    $('guestBox').hidden = !out;
    $('userBox').hidden = out;
    if (!out){ $('who').textContent = account.name; $('auto').checked = autoOn(); }
    $('guestBox').querySelector('button').disabled = !db;
    $('note').textContent = out ? (db ? '로그아웃 상태에서는 진행이 저장되지 않아요' : '이 화면에서는 로그인을 쓸 수 없어요') : '진행이 자동으로 저장돼요';
  }
  function enter(acc, data, auto){
    account = acc;
    MODES.forEach(m => { unlockedBy[m] = Math.min(TOTAL - 1, +data['prog_' + m] || (m === 'extreme' ? +data.unlocked : 0) || 0); });
    unlocked = unlockedBy[MODE];
    setAuto(auto); renderAcct(); buildSelect(); load(unlocked);
  }
  function logout(){
    account = null; setAuto(false); unlocked = 0; MODES.forEach(m => { unlockedBy[m] = 0; });
    renderAcct(); buildSelect(); load(0);
  }
  let mode = 'login';
  function setMode(m){
    mode = m;
    $('tabLogin').classList.toggle('on', m === 'login');
    $('tabSignup').classList.toggle('on', m === 'signup');
    $('pw2row').hidden = m !== 'signup';
    $('go').textContent = m === 'login' ? '로그인' : '회원가입';
    $('err').textContent = '';
  }
  async function submitAuth(e){
    e.preventDefault();
    const name = $('uid').value.trim(), pw = $('pw').value, err = $('err');
    err.textContent = '';
    if (!db){ err.textContent = '로그인을 쓸 수 없어요'; return; }
    if (!/^[A-Za-z0-9_가-힣]{2,16}$/.test(name)){ err.textContent = '아이디는 2~16자의 글자, 숫자, _ 만 쓸 수 있어요'; return; }
    if (pw.length < 4){ err.textContent = '비밀번호는 4자 이상이어야 해요'; return; }
    $('go').disabled = true;
    try {
      const ref = db.doc('accounts/' + keyOf(name)), snap = await ref.get();
      if (mode === 'signup'){
        if (pw !== $('pw2').value){ err.textContent = '비밀번호가 서로 달라요'; return; }
        if (snap.exists){ err.textContent = '이미 있는 아이디예요'; return; }
        const salt = hex(crypto.getRandomValues(new Uint8Array(16)));
        const hash = await hashPw(name, pw, salt);
        await ref.set({ name, salt, hash, unlocked: 0, created: Date.now() });
        enter({ key: keyOf(name), name, hash }, { unlocked: 0 }, $('autoNew').checked);
      } else {
        const d = snap.exists && snap.data();
        const hash = d ? await hashPw(d.name, pw, d.salt) : '';
        if (!d || hash !== d.hash){ err.textContent = '아이디 또는 비밀번호가 맞지 않아요'; return; }
        enter({ key: keyOf(name), name: d.name, hash }, d, $('autoNew').checked);
      }
      $('auth').hidden = true; $('pw').value = ''; $('pw2').value = '';
    } catch (ex) {
      err.textContent = '처리하지 못했어요. 잠시 뒤에 다시 시도해 주세요';
    } finally { $('go').disabled = false; }
  }
  $('openAuth').onclick = () => { setMode('login'); $('auth').hidden = false; $('uid').focus(); };
  $('closeAuth').onclick = () => { $('auth').hidden = true; };
  $('tabLogin').onclick = () => setMode('login');
  $('tabSignup').onclick = () => setMode('signup');
  $('authForm').addEventListener('submit', submitAuth);
  $('logout').onclick = logout;
  $('auto').onchange = e => setAuto(e.target.checked);

  document.querySelectorAll('#modes button[data-mode]').forEach(b => { b.onclick = () => switchLevel(b.dataset.mode); });
  renderModes(); Bg.set(SEASON[MODE]); Music.setMode(MODE);
  load(0);
  renderAcct();
  (async function initAuth(){
    try {
      db = window.claude && window.claude.use ? await window.claude.use('db') : null;
    } catch (e) { db = null; }
    renderAcct();
    if (!db) return;
    try {
      const saved = JSON.parse(localStorage.getItem(AUTO) || 'null');
      if (!saved) return;
      const snap = await db.doc('accounts/' + saved.key).get();
      const d = snap.exists && snap.data();
      if (d && d.hash === saved.hash) enter({ key: saved.key, name: d.name, hash: d.hash }, d, true);
      else setAuto(false);
    } catch (e) {}
  })();
})();
</script>
