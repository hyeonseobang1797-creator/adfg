<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10131c">
<title>점 잇기 퍼즐</title>
<style>
  /* Layout: centered single-column game board with a compact status bar above */
  :root{--bg:#10131c;--panel:#1a1f2e;--fg:#e8ecf5;--muted:#8791a8;--line:#2a3147;--accent:#5b8cff;--ok:#7dffb0;color-scheme:dark}
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;padding-inline:16px;padding-block:16px;display:flex;flex-direction:column;align-items:center;gap:12px;-webkit-user-select:none;user-select:none}
  h1{margin:4px 0 0;font-size:22px;text-wrap:balance}
  .sub{color:var(--muted);font-size:13px;margin:0;text-align:center;max-width:46ch}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
  button{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:15px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--accent)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .stat{background:var(--panel);border-radius:10px;padding:8px 14px;font-size:14px;text-align:center;font-variant-numeric:tabular-nums}
  canvas{width:min(100%,520px);aspect-ratio:1;touch-action:none;border-radius:14px;background:#0b0e15}
  #msg{min-height:24px;font-weight:600;color:var(--ok)}
  button:disabled{opacity:.35;cursor:default}
  button.go{border-color:var(--ok);color:var(--ok);animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 4px #7dffb033}}
  @media (prefers-reduced-motion:reduce){button.go{animation:none}}
  .chip{border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
  .chip.k0,#grid .k0{--c:#3ddc84}.chip.k1,#grid .k1{--c:#ffd23f}.chip.k2,#grid .k2{--c:#ff4d4d}.chip.k3,#grid .k3{--c:#4dd2ff}
  .chip{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
  #sel{width:min(100%,520px);max-height:260px;overflow-y:auto;background:var(--panel);border-radius:12px;padding:10px}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
  #grid button{padding:8px 0;font-size:13px;font-variant-numeric:tabular-nums;border-color:color-mix(in srgb,var(--c) 40%,var(--line))}
  #grid button.done{background:color-mix(in srgb,var(--c) 16%,var(--panel))}
  #grid button.cur{outline:2px solid var(--fg)}
  .acct{display:flex;flex-direction:column;align-items:center;gap:6px}
  #userBox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
  .note{color:var(--muted);font-size:12px}
  .chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
  #auth{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
  #auth[hidden]{display:none}
  #authForm{background:var(--panel);border-radius:14px;padding:18px;width:min(100%,340px);display:flex;flex-direction:column;gap:8px}
  #authForm label{font-size:13px;color:var(--muted)}
  #authForm input[type=text],#authForm input[type=password],#uid{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:15px;font-family:inherit}
  .tabs,.row{display:flex;gap:8px}
  .tabs button{flex:1}.tabs button.on{border-color:var(--accent);color:var(--accent)}
  .row .primary{flex:1;background:var(--accent);border-color:var(--accent);color:#fff}
  #err{min-height:18px;font-size:13px;color:#ff7a7a}
  html{overscroll-behavior:none;-webkit-text-size-adjust:100%}
  body{min-height:100%;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;padding-bottom:max(16px,env(safe-area-inset-bottom))}
  button{min-height:40px}
  /* 모바일: 주소창·하단 막대에 가리지 않게 아래 여백을 크게 두고, 판이 한 화면에 들어오도록 높이에 맞춘다 */
  [hidden]{display:none!important}
  html{height:auto;overflow-y:auto;overscroll-behavior:auto}
  body{min-height:100vh;min-height:100dvh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  canvas{width:min(100%,520px,max(260px,calc(100vh - 330px)));width:min(100%,520px,max(260px,calc(100dvh - 330px)))}
  @media (max-height:720px){.sub{display:none}}
  #modes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
    h1,.sub,.note{text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .sub,.note{color:#e3e9f7}
  button{position:relative;overflow:hidden;transition:transform .08s ease,box-shadow .18s ease,border-color .18s ease,background-color .18s ease}
  button:not(:disabled):hover{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
  button:not(:disabled):active{transform:scale(.94)}
  .rip{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.38);transform:scale(0);animation:rip .5s ease-out forwards}
  @keyframes rip{to{transform:scale(1);opacity:0}}
  #musicBtn{font-size:13px;padding:6px 12px;min-height:34px}
  #musicBtn[aria-pressed=false]{opacity:.6}
  #modes button.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--panel))}
</style>
</head>

<h1>점 잇기 퍼즐</h1>
<p class="sub">같은 색 점끼리 선으로 연결하고, 판의 모든 칸을 채우세요. 선은 서로 겹칠 수 없어요.</p>

  <div id="guestBox"><button id="openAuth">로그인 / 회원가입</button></div>

<div id="modes"><button data-mode="easy">쉬움</button><button data-mode="normal">보통</button><button data-mode="hard">어려움</button><button data-mode="extreme">익스트림</button></div>
<div class="musicrow"><button id="musicBtn" aria-pressed="true">♪ 음악 켬</button></div>
<div class="bar">
  <button id="prev" aria-label="이전 스테이지">◀</button>
  <div class="stat" id="lvl">스테이지 1</div><div class="chip k0" id="diff" hidden></div>

  <div class="stat" id="fill">채움 0%</div>
  <button id="hint">힌트</button>
  <button id="reset">다시</button>
  <button id="pick">목록</button>
</div>
<canvas id="c" width="520" height="520"></canvas>
<div id="msg"></div>
<div id="sel" hidden><div id="grid"></div></div>
<script>
// 이 파일을 단독으로 열면 계정은 이 기기의 브라우저에만 저장된다
(function(){
  if (window.claude && window.claude.use) return;
  var KEY = 'dotsLocalDb';
  function load(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
  function save(o){ localStorage.setItem(KEY, JSON.stringify(o)); }
  var db = { doc: function(p){ return {
    get: async function(){ var d = load()[p]; return { exists: !!d, data: function(){ return d; } }; },
    set: async function(x){ var o = load(); o[p] = x; save(o); },
    update: async function(x){ var o = load(); o[p] = Object.assign({}, o[p], x); save(o); }
  }; } };
  window.claude = { use: async function(n){ return n === 'db' ? db : null; } };
})();
</script>

const TOTAL = 480;
const KINDS = ['', '어려움', '하드', '쉬움'];

// 스테이지가 올라갈수록 조금씩 계속 어려워진다: 판이 커지고, 선이 길고 구불해지고, 색이 늘어난다
function stageParams(i){
  const d = i / (TOTAL - 1), no = i + 1;
  // 1~60번은 쉬움: 4×4, 5×5, 6×6 중 무작위. 이후는 갈수록 어려워진다.
  // 10스테이지마다 어려움, 300스테이지부터는 어려움과 하드가 번갈아 나온다.
  let kind = 0;
  if (no % 10 === 0) kind = no >= 300 && (no / 10) % 2 === 0 ? 2 : 1;
  const base = no <= 60 ? 4 + Math.floor(mulberry32(no * 31 + 5)() * 3) : 6 + Math.min(4, Math.floor((no - 61) / 440 * 5));
  return {
    kind, d,
    n: Math.min(12, base + [0, 1, 2, 0][kind]),
    pBreak: 0.30 - 0.22 * d - [0, 0.04, 0.07, 0][kind],
    lo: 0.7, hi: 1.0 + 0.3 * d
  };
}
function maxHints(kind){ return kind === 1 || kind === 2 ? 3 : 2; }

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function neighbors(i, n){
  const r = Math.floor(i / n), c = i % n, out = [];
  if (r > 0) out.push(i - n);
  if (r < n - 1) out.push(i + n);
  if (c > 0) out.push(i - 1);
  if (c < n - 1) out.push(i + 1);
  return out;
}

  function palm(c, x, base, h, r){

  // ----- 떨어지는 것들의 모양 -----
  function petal(c, s, flip){
    c.scale(Math.max(0.25, Math.abs(flip)), 1);
    const gr = c.createLinearGradient(0, -s, 0, s); gr.addColorStop(0, '#ffe3ee'); gr.addColorStop(1, '#ff9fc2');
    c.fillStyle = gr; c.beginPath();
    c.moveTo(0, s); c.bezierCurveTo(-s * 1.1, s * 0.3, -s * 0.9, -s * 0.9, -s * 0.14, -s); c.lineTo(0, -s * 0.76); c.lineTo(s * 0.14, -s);
    c.bezierCurveTo(s * 0.9, -s * 0.9, s * 1.1, s * 0.3, 0, s); c.fill();
  }
  const MAPLE = [[0, -1], [0.14, -0.62], [0.42, -0.78], [0.36, -0.3], [0.9, -0.4], [0.62, 0], [0.84, 0.3], [0.3, 0.22], [0.1, 0.62]];
  function leaf(c, s, col, kind, flip){
    c.scale(Math.max(0.3, Math.abs(flip)), 1);
    c.fillStyle = col; c.beginPath();
    if (kind){
      c.moveTo(0, -s); MAPLE.forEach(p => c.lineTo(p[0] * s, p[1] * s)); c.lineTo(0, s * 0.78);
      for (let i = MAPLE.length - 1; i >= 0; i--) c.lineTo(-MAPLE[i][0] * s, MAPLE[i][1] * s);
    } else {
      c.moveTo(0, -s); c.bezierCurveTo(s * 0.9, -s * 0.5, s * 0.8, s * 0.5, 0, s * 0.8); c.bezierCurveTo(-s * 0.8, s * 0.5, -s * 0.9, -s * 0.5, 0, -s);

    c.beginPath(); c.moveTo(0, -s * 0.8); c.lineTo(0, s * 1.05); c.stroke();
  }
  function flake(c, r){

  }

  // ----- 움직이는 것들 -----
  function make(){
    const n = Math.max(22, Math.min(60, Math.round(W * H / 26000)));
    parts = [];
    for (let i = 0; i < n; i++){
      const p = { x: rnd(0, W), y: rnd(0, H), ph: rnd(0, 6.28), rot: rnd(0, 6.28), vr: rnd(-1.2, 1.2), tum: rnd(0, 6.28), tv: rnd(1.5, 3.5) };

      else if (season === 'autumn'){ p.s = rnd(8, 13); p.vy = rnd(34, 62); p.c = ['#e8791d', '#d1451b', '#f2b134', '#b23a14'][i % 4]; p.k = i % 3 === 0 ? 0 : 1; }

    } else if (season === 'winter'){
      for (let k = 0; k < 3; k++){
        const yy = H * (0.2 + k * 0.07), ag = g.createLinearGradient(0, yy - 60, 0, yy + 60); ag.addColorStop(0, 'rgba(80,255,170,0)'); ag.addColorStop(0.5, 'rgba(80,255,170,' + (0.09 + 0.04 * Math.sin(t / 2500 + k)) + ')'); ag.addColorStop(1, 'rgba(120,120,255,0)');
        g.fillStyle = ag; g.beginPath(); g.moveTo(0, yy);
        for (let x = 0; x <= W; x += 20) g.lineTo(x, yy + Math.sin(x / 140 + t / 3000 + k * 2) * 26);

      }

      const gl = g.createRadialGradient(mx, my, 0, mx, my, 130); gl.addColorStop(0, 'rgba(210,225,255,0.45)'); gl.addColorStop(1, 'rgba(210,225,255,0)');
      g.fillStyle = gl; g.fillRect(mx - 140, my - 140, 280, 280);
      g.fillStyle = '#f2f6ff'; g.beginPath(); g.arc(mx, my, 26, 0, 6.283); g.fill();
      g.fillStyle = 'rgba(160,175,205,0.35)'; for (const c of [[-8, -6, 6], [7, 5, 5], [-3, 10, 3.5]]){ g.beginPath(); g.arc(mx + c[0], my + c[1], c[2], 0, 6.283); g.fill(); }
    }
    if (season !== 'winter'){
      const tint = season === 'spring' ? '255,225,235' : season === 'autumn' ? '255,215,170' : '255,255,255';
      for (const c of clouds) cloud(g, c.x, c.y, c.s, season === 'summer' ? 0.5 : 0.32, tint);
    }
  }
  function drawParts(t){
    for (const p of parts){
      const x = p.x + Math.sin(t / 1300 + p.ph) * 20;
      g.save(); g.translate(x, p.y); g.rotate(p.rot);
      const flip = Math.cos(p.tum + t / 1000 * p.tv);
      if (season === 'summer'){
        g.rotate(-p.rot);
        const gr = g.createRadialGradient(0, 0, 0, 0, 0, p.r * 2.4); gr.addColorStop(0, 'rgba(255,248,200,' + p.a + ')'); gr.addColorStop(1, 'rgba(255,248,200,0)');
        g.fillStyle = gr; g.beginPath(); g.arc(0, 0, p.r * 2.4, 0, 6.283); g.fill();
      } else if (season === 'spring') petal(g, p.s, flip);
      else if (season === 'autumn') leaf(g, p.s, p.c, p.k, flip);
      else flake(g, p.r);
      g.restore();
    }
    if (chimney){
      for (let k = 0; k < 7; k++){
        const u = ((t / 3200) + k / 7) % 1, px = chimney.x + u * chimney.w * 0.6 + Math.sin(u * 7 + k) * 4, py = chimney.y - u * chimney.w * 1.3, rr = 3 + u * 11;
        g.fillStyle = 'rgba(225,233,246,' + ((1 - u) * 0.32) + ')'; g.beginPath(); g.arc(px, py, rr, 0, 6.283); g.fill();
      }
    }
    if (season === 'summer'){
      for (const s of glints){ g.fillStyle = 'rgba(255,248,210,' + (0.15 + 0.55 * Math.max(0, Math.sin(t / 500 + s.ph))) + ')'; g.fillRect(s.x, s.y, s.w, 1.4); }

    }
  }
  function frame(t){
    g.clearRect(0, 0, W, H);
    sky(t);
    g.drawImage(scene, 0, 0, W, H);
    drawParts(t);
  }
  function step(t){
    raf = requestAnimationFrame(step);
    if (t - last < 33) return;
    const dt = Math.min(0.1, (t - last) / 1000); last = t;
    for (const p of parts){
      p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.vy > 0 && p.y > H + 24){ p.y = -24; p.x = rnd(0, W); }
      if (p.vy < 0 && p.y < -24){ p.y = H + 24; p.x = rnd(0, W); }
    }
    for (const c of clouds){ c.x += c.v * dt; if (c.x - c.s * 2 > W) c.x = -c.s * 2; }
    for (const b of gulls){ b.x += b.v * dt; if (b.x > W + 30) b.x = -30; }
    frame(t);
  }
  function resize(){
    D = Math.min(window.devicePixelRatio || 1, 2); W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * D); cv.height = Math.round(H * D);
    g.setTransform(D, 0, 0, D, 0, 0);
    buildScene();
  }
  function set(s){
    season = s;
    const c = SKY[s];
    document.body.style.background = 'linear-gradient(180deg,' + c[0] + ',' + c[1] + ' 55%,' + c[2] + ') fixed';
    document.body.style.backgroundColor = c[1];
    resize(); make();
    cancelAnimationFrame(raf);
    if (reduce) frame(0); else { last = 0; raf = requestAnimationFrame(step); }

})();

// ---------------- 배경음악 (직접 만든 곡을 브라우저에서 소리로 합성한다. 외부 음원이 없어 저작권 문제가 없다) ----------------
const Music = (() => {
  const CFG = {
    easy:    { bpm: 108, root: 60, scale: [0, 2, 4, 7, 9], chords: [[0, 'M'], [5, 'M'], [7, 'M'], [5, 'M']], dens: 0.72, oct: 12, lead: 'triangle', bass: 'sine', tick: true, wet: 0.22 },
    normal:  { bpm: 88, root: 62, scale: [0, 2, 4, 7, 9], chords: [[0, 'M'], [7, 'M'], [9, 'm'], [5, 'M']], dens: 0.5, oct: 12, lead: 'sine', bass: 'sine', bell: true, wet: 0.35 },
    hard:    { bpm: 76, root: 57, scale: [0, 3, 5, 7, 10], chords: [[0, 'm'], [8, 'M'], [3, 'M'], [10, 'M']], dens: 0.5, oct: 12, lead: 'triangle', bass: 'sawtooth', wet: 0.3 },
    extreme: { bpm: 60, root: 64, scale: [0, 3, 5, 7, 10], chords: [[0, 'm'], [8, 'M'], [5, 'M'], [10, 'M']], dens: 0.33, oct: 24, lead: 'sine', bass: 'sine', bell: true, drone: true, wet: 0.5 }
  };
  const TRIAD = { M: [0, 4, 7], m: [0, 3, 7] };
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function bus(ctx, out, cfg){
    const input = ctx.createGain(), dry = ctx.createGain(), send = ctx.createGain();
    const dl = ctx.createDelay(1), fb = ctx.createGain(), lp = ctx.createBiquadFilter();
    dry.gain.value = 1; send.gain.value = cfg.wet; dl.delayTime.value = 30 / cfg.bpm * 3; fb.gain.value = 0.42;
    lp.type = 'lowpass'; lp.frequency.value = 2400;
    input.connect(dry); dry.connect(out);
    input.connect(send); send.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(out);
    return { input };
  }
  function tone(ctx, b, type, f, t, dur, vol, att, filt){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + att);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let n = o;
    if (filt){ const q = ctx.createBiquadFilter(); q.type = 'lowpass'; q.frequency.value = filt; o.connect(q); n = q; }
    n.connect(g); g.connect(b.input);
    o.start(t); o.stop(t + dur + 0.05);
  }
  let noiseBuf = null;
  function noise(ctx, b, t, vol){
    if (!noiseBuf){ noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.08, ctx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = ctx.createBufferSource(), g = ctx.createGain(), h = ctx.createBiquadFilter();
    s.buffer = noiseBuf; h.type = 'highpass'; h.frequency.value = 6000;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    s.connect(h); h.connect(g); g.connect(b.input); s.start(t);
  }
  // 한 박자(8분음표) 분량을 예약한다. step은 0부터 올라간다. 네 마디(32스텝)가 한 바퀴.
  function schedule(ctx, b, cfg, step, t, st){
    const sd = 30 / cfg.bpm, bar = Math.floor(step / 8) % 4, ch = cfg.chords[bar], base = cfg.root + ch[0];
    if (step % 8 === 0){
      TRIAD[ch[1]].forEach((iv, i) => tone(ctx, b, 'sine', mtof(base + 12 + iv), t, sd * 8 * 0.98, 0.035, 0.7 + i * 0.08));
    }
    if (step % 4 === 0) tone(ctx, b, cfg.bass, mtof(base - 12), t, sd * 3, cfg.bass === 'sawtooth' ? 0.07 : 0.11, 0.02, cfg.bass === 'sawtooth' ? 420 : 0);
    if (cfg.tick && step % 2 === 1) noise(ctx, b, t, 0.025);
    if (cfg.drone && step % 32 === 0){
      tone(ctx, b, 'sine', mtof(cfg.root - 24), t, sd * 32, 0.05, 2.5);
      tone(ctx, b, 'sine', mtof(cfg.root - 24 + 7), t, sd * 32, 0.03, 3);
    }
    if (Math.random() < cfg.dens){
      const n = cfg.scale.length;
      st.pos = Math.max(0, Math.min(n * 2 - 1, st.pos + [-2, -1, -1, 0, 1, 1, 2][Math.floor(Math.random() * 7)]));
      const m = cfg.root + cfg.scale[st.pos % n] + 12 * Math.floor(st.pos / n) + cfg.oct - 12;
      const dur = sd * (1 + Math.floor(Math.random() * 3));
      tone(ctx, b, cfg.lead, mtof(m), t, dur * 1.6, 0.09, 0.012);
      if (cfg.bell) tone(ctx, b, 'sine', mtof(m) * 2.01, t, dur, 0.025, 0.008);
    }
  }
  // 소리 파일을 만들 때나 시험할 때 쓴다: 지정한 초만큼 미리 예약한다.
  function renderSchedule(ctx, mode, seconds){
    const cfg = CFG[mode], out = ctx.createGain(), comp = ctx.createDynamicsCompressor();
    out.gain.value = 1.0; out.connect(comp); comp.connect(ctx.destination);
    const b = bus(ctx, out, cfg), st = { pos: 3 }, sd = 30 / cfg.bpm;
    for (let s = 0, t = 0; t < seconds; s++, t += sd) schedule(ctx, b, cfg, s, t, st);
  }

  let ctx = null, master = null, sfxOut = null, cur = null, timer = 0, step = 0, nextT = 0, mode = 'easy', want = false, st = { pos: 3 };
  const btn = document.getElementById('musicBtn');
  function paint(){ if (btn){ btn.setAttribute('aria-pressed', want ? 'true' : 'false'); btn.textContent = want ? '♪ 소리 켬' : '♪ 소리 끔'; } }
  function ensure(){
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0;
    const comp = ctx.createDynamicsCompressor();
    master.connect(comp); comp.connect(ctx.destination);
    sfxOut = ctx.createGain(); sfxOut.gain.value = 0.9; sfxOut.connect(comp);
    return true;
  }
  function loop(){
    const cfg = CFG[mode], sd = 30 / cfg.bpm;
    while (nextT < ctx.currentTime + 0.5){ schedule(ctx, cur, cfg, step, nextT, st); nextT += sd; step++; }
  }
  function begin(){
    clearInterval(timer);
    if (cur) try { cur.input.disconnect(); } catch (e) {}
    cur = bus(ctx, master, CFG[mode]); step = 0; st = { pos: 3 }; nextT = ctx.currentTime + 0.1;
    timer = setInterval(loop, 120);
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setTargetAtTime(1.0, ctx.currentTime, 0.5);
  }
  function start(){
    want = true; paint();
    try { localStorage.setItem('dotsMusic', '1'); } catch (e) {}
    if (!ensure()) return;
    ctx.resume(); begin();
  }
  function stop(){
    want = false; paint();
    try { localStorage.setItem('dotsMusic', '0'); } catch (e) {}
    if (!ctx) return;
    master.gain.setTargetAtTime(0, ctx.currentTime, 0.15);
    clearInterval(timer);
  }
  function setMode(m){
    mode = m;
    if (ctx && want){
      master.gain.setTargetAtTime(0, ctx.currentTime, 0.1);
      clearInterval(timer);
      setTimeout(() => { if (want) begin(); }, 450);
    }
  }
  if (btn) btn.onclick = () => { want ? stop() : start(); };
  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else if (want) ctx.resume();
  });
  // 브라우저는 사용자가 한 번 누른 뒤에야 소리를 허락한다. 끈 적이 없으면 첫 터치에서 시작한다.
  let pref = '1'; try { pref = localStorage.getItem('dotsMusic') || '1'; } catch (e) {}
  want = pref === '1'; paint();
  if (want){
    const first = () => { document.removeEventListener('pointerdown', first); document.removeEventListener('keydown', first); if (want) start(); };
    document.addEventListener('pointerdown', first); document.addEventListener('keydown', first);
  }
  // 효과음: 소리가 켜져 있을 때만 낸다
  function sfx(fn){
    if (!want) return;
    try { if (!ensure()) return; if (ctx.state === 'suspended') ctx.resume(); fn(ctx, sfxOut, ctx.currentTime); } catch (e) {}
  }
  return { setMode, start, stop, renderSchedule, sfx };
})();

const Sfx = (() => {
  const P = [0, 2, 4, 7, 9], mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function tn(ctx, out, type, f, t, dur, vol, att){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + att); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.05);
  }
  return {
    tick(i){ Music.sfx((c, o, t) => { const m = 72 + P[i % 5] + 12 * (Math.floor(i / 5) % 2); tn(c, o, 'triangle', mtof(m), t, 0.16, 0.07, 0.004); tn(c, o, 'sine', mtof(m) * 2, t, 0.08, 0.02, 0.004); }); },
    connect(){ Music.sfx((c, o, t) => { [79, 86].forEach((m, k) => { tn(c, o, 'sine', mtof(m), t + k * 0.08, 0.45, 0.13, 0.005); tn(c, o, 'triangle', mtof(m) * 2, t + k * 0.08, 0.25, 0.04, 0.005); }); }); },
    clear(){ Music.sfx((c, o, t) => { [72, 76, 79, 84, 88, 91].forEach((m, k) => { tn(c, o, 'sine', mtof(m), t + k * 0.09, 0.7, 0.12, 0.006); tn(c, o, 'triangle', mtof(m) * 2, t + k * 0.09, 0.35, 0.04, 0.006); }); }); },
    click(){ Music.sfx((c, o, t) => { tn(c, o, 'sine', 880, t, 0.06, 0.05, 0.002); tn(c, o, 'sine', 1320, t + 0.01, 0.05, 0.02, 0.002); }); },
    cut(){ Music.sfx((c, o, t) => { tn(c, o, 'sine', 170, t, 0.12, 0.09, 0.004); }); },
    hint(){ Music.sfx((c, o, t) => { [88, 91, 95].forEach((m, k) => tn(c, o, 'sine', mtof(m), t + k * 0.06, 0.5, 0.06, 0.005)); }); }
  };
})();

// ---------------- 게임 ----------------
if (typeof document !== 'undefined') (function(){
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  let levelIdx = 0, n, sol, pairs, endOf, paths, active = -1, moves = 0, solved = false, kind = 0;
  let unlocked = 0;   // 현재 난이도에서 연 스테이지. 로그아웃 상태에서는 저장하지 않는다
  const unlockedBy = { easy: 0, normal: 0, hard: 0, extreme: 0 };
  const MODES = ['easy', 'normal', 'hard', 'extreme'];
  function renderModes(){ document.querySelectorAll('#modes button[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === MODE)); }
  function switchLevel(m){
    if (m === MODE) return;
    unlockedBy[MODE] = unlocked; MODE = m; unlocked = unlockedBy[m];
    try { localStorage.setItem('dotsMode', m); } catch (e) {}
    renderModes(); Bg.set(SEASON[MODE]); Music.setMode(MODE); buildSelect(); load(unlocked);
  }


  function load(idx){
    levelIdx = Math.max(0, Math.min(Math.min(idx, unlocked), TOTAL - 1));
    const lv = makeLevel(levelIdx);
    n = lv.n; pairs = lv.pairs; sol = lv.sol; kind = lv.kind;
    endOf = new Array(n * n).fill(-1);
    pairs.forEach((p, c) => { endOf[p[0]] = c; endOf[p[1]] = c; });
    paths = pairs.map(() => []);
    active = -1; moves = 0; solved = false;
    $('msg').textContent = '';
    draw(); updateUI();
  }

  function ownerAt(cell){
    for (let c = 0; c < paths.length; c++){
      const i = paths[c].indexOf(cell);
      if (i !== -1) return [c, i];
    }
    return null;
  }
  function isComplete(c){
    const p = paths[c];
    return p.length > 1 && endOf[p[0]] === c && endOf[p[p.length - 1]] === c && p[0] !== p[p.length - 1];
  }

  function cellFromEvent(e){
    const r = cv.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    if (x < 0 || y < 0 || x >= 1 || y >= 1) return -1;
    return Math.floor(y * n) * n + Math.floor(x * n);
  }

  function start(cell){
    if (solved) return;
    if (endOf[cell] !== -1){
      const c = endOf[cell];
      paths[c] = [cell];
      active = c; moves++; fxRing(cell, COLORS[c % COLORS.length]); Sfx.tick(0);
    } else {
      const o = ownerAt(cell);
      if (!o) return;
      const [c, i] = o;
      paths[c] = paths[c].slice(0, i + 1);
      active = c; moves++;
    }
    draw(); updateUI();
  }

  function stepTo(cell){
    const c = active, p = paths[c], head = p[p.length - 1];
    if (cell === head) return;
    const idx = p.indexOf(cell);
    if (idx !== -1){ paths[c] = p.slice(0, idx + 1); return; }   // 되돌리기
    if (!neighbors(head, n).includes(cell)) return;
    // 이미 도착 지점에 닿았으면 더 못 늘림
    if (p.length > 1 && endOf[head] === c) return;
    if (endOf[cell] !== -1 && endOf[cell] !== c) return;          // 남의 점은 통과 불가
    const o = ownerAt(cell);
    if (o && o[0] !== c){ paths[o[0]] = paths[o[0]].slice(0, o[1]); fxBurst(cell, COLORS[o[0] % COLORS.length], 6); Sfx.cut(); }   // 다른 선 자르기
    p.push(cell);
    fxRing(cell, COLORS[c % COLORS.length]);
    if (endOf[cell] === c && p.length > 1){ pairs[c].forEach(i => fxBurst(i, COLORS[c % COLORS.length], 14)); Sfx.connect(); buzz(18); }
    else Sfx.tick(p.length);
  }

  function move(cell){
    if (active === -1 || cell === -1) return;
    const p = paths[active];
    let head = p[p.length - 1];
    // 빠르게 드래그해도 칸을 건너뛰지 않도록 한 칸씩 이동
    let guard = 0;
    while (head !== cell && guard++ < n * 2){
      const hr = Math.floor(head / n), hc = head % n, tr = Math.floor(cell / n), tc = cell % n;
      let next;
      if (Math.abs(tr - hr) >= Math.abs(tc - hc)) next = head + Math.sign(tr - hr) * n;
      else next = head + Math.sign(tc - hc);
      const before = paths[active].length;
      stepTo(next);
      const q = paths[active];
      const nh = q[q.length - 1];
      if (nh === head && q.length === before) break;
      head = nh;
    }
    draw(); updateUI();
  }

  function end(){
    if (active === -1) return;
    active = -1;
    checkWin();
    draw(); updateUI();
  }

  function checkWin(){
    if (!paths.every((_, c) => isComplete(c))) return;
    const filled = paths.reduce((s, p) => s + p.length, 0);
    if (filled !== n * n) { $('msg').textContent = '모든 칸을 채워야 해요!'; return; }
    solved = true; fxConfetti(); Sfx.clear(); buzz([20, 50, 20, 50, 40]);
    $('msg').textContent = levelIdx + 1 >= TOTAL ? '🏆 전체 클리어!' : '🎉 클리어! 잠시 후 다음 스테이지로 넘어가요';
    if (levelIdx + 1 > unlocked && levelIdx + 1 < TOTAL){ unlocked = levelIdx + 1; saveProgress(unlocked); }
    buildSelect();
    if (levelIdx + 1 < TOTAL){
      const cleared = levelIdx;
      setTimeout(() => { if (solved && levelIdx === cleared) load(cleared + 1); }, 2200);
    }
  }

  const hintUsed = {};   // 스테이지마다 따로 주어지고 쌓이지 않는다
  function hintsLeft(){ return maxHints(kind) - (hintUsed[levelIdx] || 0); }

  function updateUI(){
    $('lvl').textContent = '스테이지 ' + (levelIdx + 1) + ' / ' + TOTAL;
    const dc = $('diff'); dc.hidden = kind !== 2; dc.textContent = KINDS[kind]; dc.className = 'chip k' + kind;
    const hb = $('hint'); hb.textContent = '힌트 ' + hintsLeft() + '/' + maxHints(kind); hb.disabled = solved || hintsLeft() <= 0;
    $('prev').disabled = levelIdx === 0;
    $('next').disabled = !(solved || levelIdx < unlocked) || levelIdx >= TOTAL - 1;
    $('next').classList.toggle('go', solved && levelIdx < TOTAL - 1);
    const done = paths.filter((_, c) => isComplete(c)).length;
    $('flows').textContent = '연결 ' + done + '/' + pairs.length;
    const filled = paths.reduce((s, p) => s + p.length, 0);
    $('fill').textContent = '채움 ' + Math.round(filled / (n * n) * 100) + '%';
    if (!solved && done < pairs.length) $('msg').textContent = '';
  }

  // ---------------- 그리기: 윤기 있는 선, 반짝이는 점, 효과 ----------------
  const reduceFx = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fxs = [];   // 잠깐 보였다 사라지는 효과(물결, 불꽃, 색종이)
  const rgbOf = h => { const v = parseInt(h.slice(1), 16); return [v >> 16 & 255, v >> 8 & 255, v & 255]; };
  const shade = (h, k) => { const [r, g, b] = rgbOf(h), t = k < 0 ? 0 : 255, a = Math.abs(k); return 'rgb(' + Math.round(r + (t - r) * a) + ',' + Math.round(g + (t - g) * a) + ',' + Math.round(b + (t - b) * a) + ')'; };
  const alphaOf = (h, a) => { const [r, g, b] = rgbOf(h); return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')'; };
  function rr(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  const cellXY = i => [(i % n + 0.5), (Math.floor(i / n) + 0.5)];   // 칸 단위 좌표(그릴 때 s를 곱한다)
  function fxRing(cell, col, big){ if (reduceFx) return; const [x, y] = cellXY(cell); fxs.push({ k: 'ring', x, y, col, t0: performance.now(), life: big ? 650 : 380, r1: big ? 1.1 : 0.7 }); }
  function fxBurst(cell, col, cnt){
    if (reduceFx) return; const [x, y] = cellXY(cell), t0 = performance.now();
    for (let i = 0; i < cnt; i++){ const a = Math.random() * 6.283, v = 1.2 + Math.random() * 2.6; fxs.push({ k: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.6, col, t0, life: 500 + Math.random() * 400 }); }
    fxRing(cell, col, true);
  }
  function fxConfetti(){
    if (reduceFx) return; const t0 = performance.now();
    for (let i = 0; i < 110; i++) fxs.push({ k: 'conf', x: Math.random() * n, y: -0.5 - Math.random() * 2, vx: (Math.random() - 0.5) * 1.2, vy: 1.5 + Math.random() * 3, col: COLORS[i % COLORS.length], rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 10, t0, life: 1700 + Math.random() * 600 });
  }
  const buzz = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };

  function draw(){ dirty = true; }
  let dirty = true, lastT = 0;
  function loop(t){
    requestAnimationFrame(loop);
    if (t - lastT < 30) return;   // 약 30프레임
    const dt = Math.min(0.1, (t - lastT) / 1000); lastT = t;
    if (!n) return;
    render(performance.now(), dt);
  }
  function render(t, dt){
    const rect = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 3);
    const px = Math.max(200, Math.round(rect.width * dpr));
    if (cv.width !== px){ cv.width = px; cv.height = px; }
    const W = cv.width, s = W / n, gap = Math.max(1.5, s * 0.035), R = s * 0.16, c = ctx;
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, W, W);
    const bg = c.createLinearGradient(0, 0, 0, W); bg.addColorStop(0, '#0d111a'); bg.addColorStop(1, '#090c13');
    c.fillStyle = bg; c.fillRect(0, 0, W, W);
    // 칸
    for (let i = 0; i < n * n; i++){
      const x = (i % n) * s + gap, y = Math.floor(i / n) * s + gap;
      rr(c, x, y, s - gap * 2, s - gap * 2, R);
      c.fillStyle = '#3a4255'; c.fill();
      c.strokeStyle = 'rgba(255,255,255,0.06)'; c.lineWidth = 1; c.stroke();
    }
    const ctr = i => [(i % n + 0.5) * s, (Math.floor(i / n) + 0.5) * s];
    // 선이 지나간 칸은 선 색으로 은은하게 물든다
    paths.forEach((p, k) => {
      if (!p.length) return;
      const col = COLORS[k % COLORS.length];
      p.forEach(i => {
        const x = (i % n) * s + gap, y = Math.floor(i / n) * s + gap;
        rr(c, x, y, s - gap * 2, s - gap * 2, R); c.fillStyle = alphaOf(col, 0.26); c.fill();
      });
    });
    // 선: 부드럽게 꺾이는 윤기 있는 관
    paths.forEach((p, k) => {
      if (p.length < 2) return;
      const col = COLORS[k % COLORS.length], pts = p.map(ctr), path = new Path2D();
      path.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length - 1; i++) path.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2);
      path.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
      c.lineCap = 'round'; c.lineJoin = 'round';
      const done = isComplete(k);
      c.strokeStyle = alphaOf(col, done ? 0.3 : 0.2); c.lineWidth = s * 0.62; c.stroke(path);
      c.strokeStyle = shade(col, -0.38); c.lineWidth = s * 0.4; c.stroke(path);
      c.strokeStyle = col; c.lineWidth = s * 0.33; c.stroke(path);
      c.save(); c.translate(-s * 0.02, -s * 0.03); c.strokeStyle = shade(col, 0.4); c.lineWidth = s * 0.15; c.stroke(path); c.restore();
      c.save(); c.translate(-s * 0.045, -s * 0.07); c.strokeStyle = 'rgba(255,255,255,0.55)'; c.lineWidth = s * 0.045; c.stroke(path); c.restore();
      if (done && !reduceFx){   // 이어진 선 위로 빛이 흐른다
        c.save(); c.setLineDash([s * 0.2, s * 1.5]); c.lineDashOffset = -(t / 14) % (s * 1.7);
        c.strokeStyle = 'rgba(255,255,255,0.6)'; c.lineWidth = s * 0.1; c.stroke(path); c.restore();
      }
    });
    // 그리는 중인 선의 머리: 맥박처럼 뛰는 고리
    if (active !== -1 && paths[active].length){
      const h = paths[active][paths[active].length - 1], [x, y] = ctr(h), col = COLORS[active % COLORS.length], pu = 0.5 + 0.5 * Math.sin(t / 130);
      c.strokeStyle = 'rgba(255,255,255,' + (0.5 + 0.3 * pu) + ')'; c.lineWidth = s * 0.05; c.beginPath(); c.arc(x, y, s * (0.3 + 0.05 * pu), 0, 6.283); c.stroke();
      const gl = c.createRadialGradient(x, y, 0, x, y, s * 0.7); gl.addColorStop(0, alphaOf(col, 0.35)); gl.addColorStop(1, alphaOf(col, 0));
      c.fillStyle = gl; c.beginPath(); c.arc(x, y, s * 0.7, 0, 6.283); c.fill();
    }
    // 점: 입체감 있는 구슬
    pairs.forEach((pr, k) => {
      const col = COLORS[k % COLORS.length], done = isComplete(k);
      pr.forEach(i => {
        const [x, y] = ctr(i), ρ = s * 0.31 * (done ? 1.04 : 1);
        if (!done && !reduceFx){   // 아직 안 이은 점은 잔잔하게 숨 쉰다
          const u = ((t / 2400) + k * 0.13) % 1;
          c.strokeStyle = alphaOf(col, (1 - u) * 0.28); c.lineWidth = s * 0.04; c.beginPath(); c.arc(x, y, ρ * (1.05 + u * 0.55), 0, 6.283); c.stroke();
        }
        c.save(); c.shadowColor = 'rgba(0,0,0,0.5)'; c.shadowBlur = s * 0.14; c.shadowOffsetY = s * 0.05;
        const g = c.createRadialGradient(x - ρ * 0.32, y - ρ * 0.38, ρ * 0.08, x, y, ρ);
        g.addColorStop(0, shade(col, 0.7)); g.addColorStop(0.42, col); g.addColorStop(1, shade(col, -0.35));
        c.fillStyle = g; c.beginPath(); c.arc(x, y, ρ, 0, 6.283); c.fill(); c.restore();
        c.strokeStyle = done ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,0.28)'; c.lineWidth = Math.max(1.2, s * 0.03); c.beginPath(); c.arc(x, y, ρ, 0, 6.283); c.stroke();
        c.fillStyle = 'rgba(255,255,255,0.7)'; c.beginPath(); c.ellipse(x - ρ * 0.34, y - ρ * 0.42, ρ * 0.2, ρ * 0.11, -0.6, 0, 6.283); c.fill();
      });
    });
    // 효과
    for (let i = fxs.length - 1; i >= 0; i--){
      const f = fxs[i], age = t - f.t0, u = age / f.life;
      if (u >= 1){ fxs.splice(i, 1); continue; }
      if (f.k === 'ring'){
        c.strokeStyle = alphaOf(f.col, (1 - u) * 0.9); c.lineWidth = s * 0.07 * (1 - u) + 1;
        c.beginPath(); c.arc(f.x * s, f.y * s, s * (0.25 + f.r1 * u), 0, 6.283); c.stroke();
      } else if (f.k === 'spark'){
        f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 4 * dt;
        c.fillStyle = alphaOf(f.col, 1 - u); c.beginPath(); c.arc(f.x * s, f.y * s, s * 0.055 * (1 - u * 0.6), 0, 6.283); c.fill();
      } else {
        f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vr * dt;
        c.save(); c.translate(f.x * s, f.y * s); c.rotate(f.rot); c.fillStyle = alphaOf(f.col, 1 - Math.max(0, u - 0.7) / 0.3);
        c.fillRect(-s * 0.06, -s * 0.03, s * 0.12, s * 0.06); c.restore();
      }
    }
  }
  requestAnimationFrame(loop);

  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); const c = cellFromEvent(e); if (c !== -1) start(c); });
  cv.addEventListener('pointermove', e => { if (active !== -1) move(cellFromEvent(e)); });
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
  // 정답 선과 어긋난 부분이 있는지 본다 (그린 선이 정답 선의 앞부분과 같으면 맞는 선)
  function isWrong(c){
    const p = paths[c];
    if (p.length < 2) return false;
    const s = sol[c], ref = p[0] === s[0] ? s : s.slice().reverse();
    return p.some((x, i) => x !== ref[i]);
  }
  $('hint').onclick = () => {
    if (solved || hintsLeft() <= 0) return;
    // 1) 이미 그은 선 중 틀린 것이 있으면 그 선을 정답으로 고친다  2) 없으면 아직 안 이은 선 하나를 그어 준다
    let c = paths.findIndex((_, k) => isWrong(k)), fixed = c !== -1;
    if (!fixed) c = paths.findIndex((_, k) => !isComplete(k));
    if (c === -1) return;
    hintUsed[levelIdx] = (hintUsed[levelIdx] || 0) + 1;
    const line = sol[c].slice();
    paths[c] = line;
    // 정답 선이 지나가는 칸을 차지하고 있던 다른 선은 그 칸 앞에서 잘라 절대 겹치지 않게 한다
    const on = new Set(line);
    paths.forEach((p, k) => { if (k !== c){ const j = p.findIndex(x => on.has(x)); if (j !== -1) paths[k] = p.slice(0, j); } });
    moves++; fxRing(sol[c][0], COLORS[c % COLORS.length], true); fxRing(sol[c][sol[c].length - 1], COLORS[c % COLORS.length], true); Sfx.hint(); buzz(10);
    checkWin(); draw(); updateUI();
    if (!solved) $('msg').textContent = fixed ? '잘못 그은 선을 고쳤어요' : '선 하나를 이어 줬어요';
  };
  $('reset').onclick = () => load(levelIdx);
  $('prev').onclick = () => load(levelIdx - 1);
  $('next').onclick = () => { if (solved || levelIdx < unlocked) load(levelIdx + 1); };
  function buildSelect(){
    const box = $('grid'); box.textContent = '';
    for (let i = 0; i < TOTAL; i++){
      const b = document.createElement('button');
      b.textContent = i + 1;
      b.className = 'k' + stageParams(i).kind + (i === levelIdx ? ' cur' : '') + (i < unlocked ? ' done' : '');
      b.disabled = i > unlocked;
      b.onclick = () => { load(i); $('sel').hidden = true; };
      box.appendChild(b);
    }
  }
  $('pick').onclick = () => { const s = $('sel'); s.hidden = !s.hidden; if (!s.hidden){ buildSelect(); const c = $('grid').children[levelIdx]; if (c) c.scrollIntoView({block:'center'}); } };
  document.addEventListener('pointerdown', e => {
    const b = e.target.closest && e.target.closest('button');
    if (!b || b.disabled) return;
    Sfx.click(); buzz(6);
    if (reduceFx) return;
    const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2, sp = document.createElement('span');
    sp.className = 'rip'; sp.style.cssText = 'width:' + d + 'px;height:' + d + 'px;left:' + (e.clientX - r.left - d / 2) + 'px;top:' + (e.clientY - r.top - d / 2) + 'px';
    b.appendChild(sp); setTimeout(() => sp.remove(), 520);
  });
  // ---------------- 계정 ----------------
  let db = null, account = null;   // account = { key, name, hash }
  const AUTO = 'dotsAuto';
  const enc = new TextEncoder();
  const hex = u8 => Array.from(u8).map(b => b.toString(16).padStart(2, '0')).join('');
  const keyOf = name => 'u' + hex(enc.encode(name.toLowerCase()));
  function cheapHash(str){
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57, out = '';
    for (let r = 0; r < 4000; r++)
      for (let i = 0; i < str.length; i++){
        const ch = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677);
      }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    out = (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
    return out;
  }
  async function hashPw(name, pw, salt){
    if (!(window.crypto && crypto.subtle)) return 'c' + cheapHash(salt + name.toLowerCase() + pw);
    const k = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode(salt + name.toLowerCase()), iterations: 100000 }, k, 256);
    return hex(new Uint8Array(bits));
  }
  function saveProgress(v){
    if (!account || !db) return;
    db.doc('accounts/' + account.key).update({ ['prog_' + MODE]: v }).catch(() => { $('msg').textContent = '진행 저장에 실패했어요'; });
  }
  function setAuto(on){
    try {
      if (on && account) localStorage.setItem(AUTO, JSON.stringify({ key: account.key, hash: account.hash }));
      else localStorage.removeItem(AUTO);
    } catch (e) {}
  }
  function autoOn(){ try { return !!localStorage.getItem(AUTO); } catch (e) { return false; } }
  function renderAcct(){
    const out = !account;
    $('guestBox').hidden = !out;
    $('userBox').hidden = out;
    if (!out){ $('who').textContent = account.name; $('auto').checked = autoOn(); }
    $('guestBox').querySelector('button').disabled = !db;
    $('note').textContent = out ? (db ? '로그아웃 상태에서는 진행이 저장되지 않아요' : '이 화면에서는 로그인을 쓸 수 없어요') : '진행이 자동으로 저장돼요';
  }
  function enter(acc, data, auto){
    account = acc;
    MODES.forEach(m => { unlockedBy[m] = Math.min(TOTAL - 1, +data['prog_' + m] || (m === 'extreme' ? +data.unlocked : 0) || 0); });
    unlocked = unlockedBy[MODE];
    setAuto(auto); renderAcct(); buildSelect(); load(unlocked);
  }
  function logout(){
    account = null; setAuto(false); unlocked = 0; MODES.forEach(m => { unlockedBy[m] = 0; });
    renderAcct(); buildSelect(); load(0);
  }
  let mode = 'login';
  function setMode(m){
    mode = m;
    $('tabLogin').classList.toggle('on', m === 'login');
    $('tabSignup').classList.toggle('on', m === 'signup');
    $('pw2row').hidden = m !== 'signup';
    $('go').textContent = m === 'login' ? '로그인' : '회원가입';
    $('err').textContent = '';
  }
  async function submitAuth(e){
    e.preventDefault();
    const name = $('uid').value.trim(), pw = $('pw').value, err = $('err');
    err.textContent = '';
    if (!db){ err.textContent = '로그인을 쓸 수 없어요'; return; }
    if (!/^[A-Za-z0-9_가-힣]{2,16}$/.test(name)){ err.textContent = '아이디는 2~16자의 글자, 숫자, _ 만 쓸 수 있어요'; return; }
    if (pw.length < 4){ err.textContent = '비밀번호는 4자 이상이어야 해요'; return; }
    $('go').disabled = true;
    try {
      const ref = db.doc('accounts/' + keyOf(name)), snap = await ref.get();
      if (mode === 'signup'){
        if (pw !== $('pw2').value){ err.textContent = '비밀번호가 서로 달라요'; return; }
        if (snap.exists){ err.textContent = '이미 있는 아이디예요'; return; }
        const salt = hex(crypto.getRandomValues(new Uint8Array(16)));
        const hash = await hashPw(name, pw, salt);
        await ref.set({ name, salt, hash, unlocked: 0, created: Date.now() });
        enter({ key: keyOf(name), name, hash }, { unlocked: 0 }, $('autoNew').checked);
      } else {
        const d = snap.exists && snap.data();
        const hash = d ? await hashPw(d.name, pw, d.salt) : '';
        if (!d || hash !== d.hash){ err.textContent = '아이디 또는 비밀번호가 맞지 않아요'; return; }
        enter({ key: keyOf(name), name: d.name, hash }, d, $('autoNew').checked);
      }
      $('auth').hidden = true; $('pw').value = ''; $('pw2').value = '';
    } catch (ex) {
      err.textContent = '처리하지 못했어요. 잠시 뒤에 다시 시도해 주세요';
    } finally { $('go').disabled = false; }
  }
  $('openAuth').onclick = () => { setMode('login'); $('auth').hidden = false; $('uid').focus(); };
  $('closeAuth').onclick = () => { $('auth').hidden = true; };
  $('tabLogin').onclick = () => setMode('login');
  $('tabSignup').onclick = () => setMode('signup');
  $('authForm').addEventListener('submit', submitAuth);
  $('logout').onclick = logout;
  $('auto').onchange = e => setAuto(e.target.checked);

  document.querySelectorAll('#modes button[data-mode]').forEach(b => { b.onclick = () => switchLevel(b.dataset.mode); });
  renderModes(); Bg.set(SEASON[MODE]); Music.setMode(MODE);
  load(0);
  renderAcct();
  (async function initAuth(){
    try {
      db = window.claude && window.claude.use ? await window.claude.use('db') : null;
    } catch (e) { db = null; }
    renderAcct();
    if (!db) return;
    try {
      const saved = JSON.parse(localStorage.getItem(AUTO) || 'null');
      if (!saved) return;
      const snap = await db.doc('accounts/' + saved.key).get();
      const d = snap.exists && snap.data();
      if (d && d.hash === saved.hash) enter({ key: saved.key, name: d.name, hash: d.hash }, d, true);
      else setAuto(false);
    } catch (e) {}
  })();
})();
</script>
</body>
