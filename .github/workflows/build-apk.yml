name: Build APK

on:
  push:
    branches: [auto-fishing-app]
    paths-ignore: ['apk/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1 || (tail -80 build.log; exit 1)

      - name: Save APK and log to branch
        if: always()
        run: |
          mkdir -p apk
          rm -f apk/*
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk apk/auto_fishing.apk
            echo "OK $(date -u)" > apk/status.txt
          else
            echo "FAILED $(date -u)" > apk/status.txt
          fi
          cp android/build.log apk/build.log || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A apk
          git commit -m "APK build result" || true
          git push
