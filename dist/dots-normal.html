<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10131c">
<title>점 잇기 퍼즐 - 보통 버전</title>
<style>
  /* Layout: centered single-column game board with a compact status bar above */
  :root{--bg:#10131c;--panel:#1a1f2e;--fg:#e8ecf5;--muted:#8791a8;--line:#2a3147;--accent:#5b8cff;--ok:#7dffb0;color-scheme:dark}
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;padding-inline:16px;padding-block:16px;display:flex;flex-direction:column;align-items:center;gap:12px;-webkit-user-select:none;user-select:none}
  h1{margin:4px 0 0;font-size:22px;text-wrap:balance}
  .sub{color:var(--muted);font-size:13px;margin:0;text-align:center;max-width:46ch}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
  button{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:15px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--accent)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .stat{background:var(--panel);border-radius:10px;padding:8px 14px;font-size:14px;text-align:center;font-variant-numeric:tabular-nums}
  canvas{width:min(100%,520px);aspect-ratio:1;touch-action:none;border-radius:14px;background:#0b0e15}
  #msg{min-height:24px;font-weight:600;color:var(--ok)}
  button:disabled{opacity:.35;cursor:default}
  button.go{border-color:var(--ok);color:var(--ok);animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 4px #7dffb033}}
  @media (prefers-reduced-motion:reduce){button.go{animation:none}}
  .chip{border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
  .chip.k0,#grid .k0{--c:#3ddc84}.chip.k1,#grid .k1{--c:#ffd23f}.chip.k2,#grid .k2{--c:#ff4d4d}.chip.k3,#grid .k3{--c:#4dd2ff}
  .chip{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
  #sel{width:min(100%,520px);max-height:260px;overflow-y:auto;background:var(--panel);border-radius:12px;padding:10px}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
  #grid button{padding:8px 0;font-size:13px;font-variant-numeric:tabular-nums;border-color:color-mix(in srgb,var(--c) 40%,var(--line))}
  #grid button.done{background:color-mix(in srgb,var(--c) 16%,var(--panel))}
  #grid button.cur{outline:2px solid var(--fg)}
  .acct{display:flex;flex-direction:column;align-items:center;gap:6px}
  #userBox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
  .note{color:var(--muted);font-size:12px}
  .chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
  #auth{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
  #auth[hidden]{display:none}
  #authForm{background:var(--panel);border-radius:14px;padding:18px;width:min(100%,340px);display:flex;flex-direction:column;gap:8px}
  #authForm label{font-size:13px;color:var(--muted)}
  #authForm input[type=text],#authForm input[type=password],#uid{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:15px;font-family:inherit}
  .tabs,.row{display:flex;gap:8px}
  .tabs button{flex:1}.tabs button.on{border-color:var(--accent);color:var(--accent)}
  .row .primary{flex:1;background:var(--accent);border-color:var(--accent);color:#fff}
  #err{min-height:18px;font-size:13px;color:#ff7a7a}
  html{overscroll-behavior:none;-webkit-text-size-adjust:100%}
  body{min-height:100%;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;padding-bottom:max(16px,env(safe-area-inset-bottom))}
  button{min-height:40px}
  /* 모바일: 주소창·하단 막대에 가리지 않게 아래 여백을 크게 두고, 판이 한 화면에 들어오도록 높이에 맞춘다 */
  [hidden]{display:none!important}
  html{height:auto;overflow-y:auto;overscroll-behavior:auto}
  body{min-height:100vh;min-height:100dvh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  canvas{width:min(100%,520px,max(260px,calc(100vh - 330px)));width:min(100%,520px,max(260px,calc(100dvh - 330px)))}
  @media (max-height:720px){.sub{display:none}}
</style>
</head>
<body>
<h1>점 잇기 퍼즐</h1>
<p class="sub">같은 색 점끼리 선으로 연결하고, 판의 모든 칸을 채우세요. 선은 서로 겹칠 수 없어요.</p>
<div class="acct">
  <div id="guestBox"><button id="openAuth">로그인 / 회원가입</button></div>
  <div id="userBox" hidden><b id="who"></b><label class="chk"><input type="checkbox" id="auto"> 자동 로그인</label><button id="logout">로그아웃</button></div>
  <div class="note" id="note"></div>
</div>
<div id="auth" hidden>
  <form id="authForm" autocomplete="off">
    <div class="tabs"><button type="button" id="tabLogin" class="on">로그인</button><button type="button" id="tabSignup">회원가입</button></div>
    <label for="uid">아이디</label><input id="uid" maxlength="16" autocomplete="username">
    <label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="current-password">
    <div id="pw2row" hidden><label for="pw2">비밀번호 확인</label><input id="pw2" type="password" autocomplete="new-password"></div>
    <label class="chk"><input type="checkbox" id="autoNew" checked> 자동 로그인</label>
    <div id="err" role="alert"></div>
    <div class="row"><button type="submit" id="go" class="primary">로그인</button><button type="button" id="closeAuth">닫기</button></div>
  </form>
</div>
<div class="bar">
  <button id="prev" aria-label="이전 스테이지">◀</button>
  <div class="stat" id="lvl">스테이지 1</div><div class="chip k0" id="diff" hidden></div>
  <button id="next" aria-label="다음 스테이지">▶</button>
  <div class="stat" id="flows">연결 0/0</div>
  <div class="stat" id="fill">채움 0%</div>
  <button id="hint">힌트</button>
  <button id="reset">다시</button>
  <button id="pick">목록</button>
</div>
<canvas id="c" width="520" height="520"></canvas>
<div id="msg"></div>
<div id="sel" hidden><div id="grid"></div></div>
<script>
// 이 파일을 단독으로 열면 계정은 이 기기의 브라우저에만 저장된다
(function(){
  if (window.claude && window.claude.use) return;
  var KEY = 'dotsLocalDb_normal';
  function load(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
  function save(o){ localStorage.setItem(KEY, JSON.stringify(o)); }
  var db = { doc: function(p){ return {
    get: async function(){ var d = load()[p]; return { exists: !!d, data: function(){ return d; } }; },
    set: async function(x){ var o = load(); o[p] = x; save(o); },
    update: async function(x){ var o = load(); o[p] = Object.assign({}, o[p], x); save(o); }
  }; } };
  window.claude = { use: async function(n){ return n === 'db' ? db : null; } };
})();
</script>

const TOTAL = 480;
const KINDS = ['', '어려움', '하드', '쉬움'];

// 스테이지가 올라갈수록 조금씩 계속 어려워진다: 판이 커지고, 선이 길고 구불해지고, 색이 늘어난다
function stageParams(i){
  const d = i / (TOTAL - 1), no = i + 1;
  // 1~60번은 쉬움: 4×4, 5×5, 6×6 중 무작위. 이후는 갈수록 어려워진다.
  // 10스테이지마다 어려움, 300스테이지부터는 어려움과 하드가 번갈아 나온다.
  let kind = 0;
  if (no % 10 === 0) kind = no >= 300 && (no / 10) % 2 === 0 ? 2 : 1;
  const base = no <= 60 ? 4 + Math.floor(mulberry32(no * 31 + 5)() * 3) : 6 + Math.min(4, Math.floor((no - 61) / 440 * 5));
  return {
    kind, d,
    n: Math.min(12, base + [0, 1, 2, 0][kind]),
    pBreak: 0.30 - 0.22 * d - [0, 0.04, 0.07, 0][kind],
    lo: 0.7, hi: 1.0 + 0.3 * d
  };
}
function maxHints(kind){ return kind === 1 || kind === 2 ? 3 : 2; }

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function neighbors(i, n){
  const r = Math.floor(i / n), c = i % n, out = [];
  if (r > 0) out.push(i - n);
  if (r < n - 1) out.push(i + n);
  if (c > 0) out.push(i - 1);
  if (c < n - 1) out.push(i + 1);
  return out;
}

// 미리 만들어 둔 퍼즐을 푼다. 경로는 "시작칸:방향들"(R/L/D/U)로 저장돼 있다.
const levelCache = {};
function makeLevel(idx){
  if (levelCache[idx]) return levelCache[idx];
  const P = stageParams(idx), parts = STAGES[idx].split('|'), n = +parts[0];
  const sol = parts[1].split(',').map(t => {
    const [s, d] = t.split(':'); const p = [+s];
    for (const ch of d) p.push(p[p.length - 1] + (ch === 'R' ? 1 : ch === 'L' ? -1 : ch === 'D' ? n : -n));
    return p;
  });
  return (levelCache[idx] = { n, sol, pairs: sol.map(p => [p[0], p[p.length - 1]]), kind: P.kind });
}

// ---------------- 게임 ----------------
if (typeof document !== 'undefined') (function(){
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  let levelIdx = 0, n, sol, pairs, endOf, paths, active = -1, moves = 0, solved = false, kind = 0;
  let unlocked = 0;   // 로그아웃 상태에서는 저장하지 않는다


  function load(idx){
    levelIdx = Math.max(0, Math.min(Math.min(idx, unlocked), TOTAL - 1));
    const lv = makeLevel(levelIdx);
    n = lv.n; pairs = lv.pairs; sol = lv.sol; kind = lv.kind;
    endOf = new Array(n * n).fill(-1);
    pairs.forEach((p, c) => { endOf[p[0]] = c; endOf[p[1]] = c; });
    paths = pairs.map(() => []);
    active = -1; moves = 0; solved = false;
    $('msg').textContent = '';
    draw(); updateUI();
  }

  function ownerAt(cell){
    for (let c = 0; c < paths.length; c++){
      const i = paths[c].indexOf(cell);
      if (i !== -1) return [c, i];
    }
    return null;
  }
  function isComplete(c){
    const p = paths[c];
    return p.length > 1 && endOf[p[0]] === c && endOf[p[p.length - 1]] === c && p[0] !== p[p.length - 1];
  }

  function cellFromEvent(e){
    const r = cv.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    if (x < 0 || y < 0 || x >= 1 || y >= 1) return -1;
    return Math.floor(y * n) * n + Math.floor(x * n);
  }

  function start(cell){
    if (solved) return;
    if (endOf[cell] !== -1){
      const c = endOf[cell];
      paths[c] = [cell];
      active = c; moves++;
    } else {
      const o = ownerAt(cell);
      if (!o) return;
      const [c, i] = o;
      paths[c] = paths[c].slice(0, i + 1);
      active = c; moves++;
    }
    draw(); updateUI();
  }

  function stepTo(cell){
    const c = active, p = paths[c], head = p[p.length - 1];
    if (cell === head) return;
    const idx = p.indexOf(cell);
    if (idx !== -1){ paths[c] = p.slice(0, idx + 1); return; }   // 되돌리기
    if (!neighbors(head, n).includes(cell)) return;
    // 이미 도착 지점에 닿았으면 더 못 늘림
    if (p.length > 1 && endOf[head] === c) return;
    if (endOf[cell] !== -1 && endOf[cell] !== c) return;          // 남의 점은 통과 불가
    const o = ownerAt(cell);
    if (o && o[0] !== c) paths[o[0]] = paths[o[0]].slice(0, o[1]); // 다른 선 자르기
    p.push(cell);
  }

  function move(cell){
    if (active === -1 || cell === -1) return;
    const p = paths[active];
    let head = p[p.length - 1];
    // 빠르게 드래그해도 칸을 건너뛰지 않도록 한 칸씩 이동
    let guard = 0;
    while (head !== cell && guard++ < n * 2){
      const hr = Math.floor(head / n), hc = head % n, tr = Math.floor(cell / n), tc = cell % n;
      let next;
      if (Math.abs(tr - hr) >= Math.abs(tc - hc)) next = head + Math.sign(tr - hr) * n;
      else next = head + Math.sign(tc - hc);
      const before = paths[active].length;
      stepTo(next);
      const q = paths[active];
      const nh = q[q.length - 1];
      if (nh === head && q.length === before) break;
      head = nh;
    }
    draw(); updateUI();
  }

  function end(){
    if (active === -1) return;
    active = -1;
    checkWin();
    draw(); updateUI();
  }

  function checkWin(){
    if (!paths.every((_, c) => isComplete(c))) return;
    const filled = paths.reduce((s, p) => s + p.length, 0);
    if (filled !== n * n) { $('msg').textContent = '모든 칸을 채워야 해요!'; return; }
    solved = true;
    $('msg').textContent = levelIdx + 1 >= TOTAL ? '🏆 전체 클리어!' : '🎉 클리어! 잠시 후 다음 스테이지로 넘어가요';
    if (levelIdx + 1 > unlocked && levelIdx + 1 < TOTAL){ unlocked = levelIdx + 1; saveProgress(unlocked); }
    buildSelect();
    if (levelIdx + 1 < TOTAL){
      const cleared = levelIdx;
      setTimeout(() => { if (solved && levelIdx === cleared) load(cleared + 1); }, 1200);
    }
  }

  const hintUsed = {};   // 스테이지마다 따로 주어지고 쌓이지 않는다
  function hintsLeft(){ return maxHints(kind) - (hintUsed[levelIdx] || 0); }

  function updateUI(){
    $('lvl').textContent = '스테이지 ' + (levelIdx + 1) + ' / ' + TOTAL;
    const dc = $('diff'); dc.hidden = kind !== 2; dc.textContent = KINDS[kind]; dc.className = 'chip k' + kind;
    const hb = $('hint'); hb.textContent = '힌트 ' + hintsLeft() + '/' + maxHints(kind); hb.disabled = solved || hintsLeft() <= 0;
    $('prev').disabled = levelIdx === 0;
    $('next').disabled = !(solved || levelIdx < unlocked) || levelIdx >= TOTAL - 1;
    $('next').classList.toggle('go', solved && levelIdx < TOTAL - 1);
    const done = paths.filter((_, c) => isComplete(c)).length;
    $('flows').textContent = '연결 ' + done + '/' + pairs.length;
    const filled = paths.reduce((s, p) => s + p.length, 0);
    $('fill').textContent = '채움 ' + Math.round(filled / (n * n) * 100) + '%';
    if (!solved && done < pairs.length) $('msg').textContent = '';
  }

  function draw(){
    const W = cv.width, s = W / n;
    ctx.clearRect(0, 0, W, W);
    ctx.fillStyle = '#0b0e15'; ctx.fillRect(0, 0, W, W);
    ctx.fillStyle = '#3a4152';
    for (let i = 0; i < n * n; i++)
      ctx.fillRect((i % n) * s + 2, Math.floor(i / n) * s + 2, s - 4, s - 4);
    const ctr = i => [(i % n + .5) * s, (Math.floor(i / n) + .5) * s];
    paths.forEach((p, c) => {
      if (!p.length) return;
      const col = COLORS[c % COLORS.length];
      // 칸 배경
      ctx.globalAlpha = .35; ctx.fillStyle = col;
      p.forEach(i => { ctx.fillRect((i % n) * s + 2, Math.floor(i / n) * s + 2, s - 4, s - 4); });
      ctx.globalAlpha = 1;
      ctx.strokeStyle = col; ctx.lineWidth = s * .34; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath();
      p.forEach((i, k) => { const [x, y] = ctr(i); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
      ctx.stroke();
    });
    pairs.forEach((pr, c) => {
      ctx.fillStyle = COLORS[c % COLORS.length];
      pr.forEach(i => {
        const [x, y] = ctr(i);
        ctx.beginPath(); ctx.arc(x, y, s * .31, 0, Math.PI * 2); ctx.fill();
        if (isComplete(c)){ ctx.strokeStyle = '#fff8'; ctx.lineWidth = 2; ctx.stroke(); }
      });
    });
  }

  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); const c = cellFromEvent(e); if (c !== -1) start(c); });
  cv.addEventListener('pointermove', e => { if (active !== -1) move(cellFromEvent(e)); });
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
  // 정답 선과 어긋난 부분이 있는지 본다 (그린 선이 정답 선의 앞부분과 같으면 맞는 선)
  function isWrong(c){
    const p = paths[c];
    if (p.length < 2) return false;
    const s = sol[c], ref = p[0] === s[0] ? s : s.slice().reverse();
    return p.some((x, i) => x !== ref[i]);
  }
  $('hint').onclick = () => {
    if (solved || hintsLeft() <= 0) return;
    // 1) 이미 그은 선 중 틀린 것이 있으면 그 선을 정답으로 고친다  2) 없으면 아직 안 이은 선 하나를 그어 준다
    let c = paths.findIndex((_, k) => isWrong(k)), fixed = c !== -1;
    if (!fixed) c = paths.findIndex((_, k) => !isComplete(k));
    if (c === -1) return;
    hintUsed[levelIdx] = (hintUsed[levelIdx] || 0) + 1;
    const line = sol[c].slice();
    paths[c] = line;
    // 정답 선이 지나가는 칸을 차지하고 있던 다른 선은 그 칸 앞에서 잘라 절대 겹치지 않게 한다
    const on = new Set(line);
    paths.forEach((p, k) => { if (k !== c){ const j = p.findIndex(x => on.has(x)); if (j !== -1) paths[k] = p.slice(0, j); } });
    moves++; checkWin(); draw(); updateUI();
    if (!solved) $('msg').textContent = fixed ? '잘못 그은 선을 고쳤어요' : '선 하나를 이어 줬어요';
  };
  $('reset').onclick = () => load(levelIdx);
  $('prev').onclick = () => load(levelIdx - 1);
  $('next').onclick = () => { if (solved || levelIdx < unlocked) load(levelIdx + 1); };
  function buildSelect(){
    const box = $('grid'); box.textContent = '';
    for (let i = 0; i < TOTAL; i++){
      const b = document.createElement('button');
      b.textContent = i + 1;
      b.className = 'k' + stageParams(i).kind + (i === levelIdx ? ' cur' : '') + (i < unlocked ? ' done' : '');
      b.disabled = i > unlocked;
      b.onclick = () => { load(i); $('sel').hidden = true; };
      box.appendChild(b);
    }
  }
  $('pick').onclick = () => { const s = $('sel'); s.hidden = !s.hidden; if (!s.hidden){ buildSelect(); const c = $('grid').children[levelIdx]; if (c) c.scrollIntoView({block:'center'}); } };
  // ---------------- 계정 ----------------
  let db = null, account = null;   // account = { key, name, hash }
  const AUTO = 'dotsAuto_normal';
  const enc = new TextEncoder();
  const hex = u8 => Array.from(u8).map(b => b.toString(16).padStart(2, '0')).join('');
  const keyOf = name => 'u' + hex(enc.encode(name.toLowerCase()));
  function cheapHash(str){
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57, out = '';
    for (let r = 0; r < 4000; r++)
      for (let i = 0; i < str.length; i++){
        const ch = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677);
      }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    out = (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
    return out;
  }
  async function hashPw(name, pw, salt){
    if (!(window.crypto && crypto.subtle)) return 'c' + cheapHash(salt + name.toLowerCase() + pw);
    const k = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode(salt + name.toLowerCase()), iterations: 100000 }, k, 256);
    return hex(new Uint8Array(bits));
  }
  function saveProgress(v){
    if (!account || !db) return;
    db.doc('accounts/' + account.key).update({ unlocked: v }).catch(() => { $('msg').textContent = '진행 저장에 실패했어요'; });
  }
  function setAuto(on){
    try {
      if (on && account) localStorage.setItem(AUTO, JSON.stringify({ key: account.key, hash: account.hash }));
      else localStorage.removeItem(AUTO);
    } catch (e) {}
  }
  function autoOn(){ try { return !!localStorage.getItem(AUTO); } catch (e) { return false; } }
  function renderAcct(){
    const out = !account;
    $('guestBox').hidden = !out;
    $('userBox').hidden = out;
    if (!out){ $('who').textContent = account.name; $('auto').checked = autoOn(); }
    $('guestBox').querySelector('button').disabled = !db;
    $('note').textContent = out ? (db ? '로그아웃 상태에서는 진행이 저장되지 않아요' : '이 화면에서는 로그인을 쓸 수 없어요') : '진행이 자동으로 저장돼요';
  }
  function enter(acc, data, auto){
    account = acc; unlocked = Math.min(TOTAL - 1, +data.unlocked || 0);
    setAuto(auto); renderAcct(); buildSelect(); load(unlocked);
  }
  function logout(){
    account = null; setAuto(false); unlocked = 0;
    renderAcct(); buildSelect(); load(0);
  }
  let mode = 'login';
  function setMode(m){
    mode = m;
    $('tabLogin').classList.toggle('on', m === 'login');
    $('tabSignup').classList.toggle('on', m === 'signup');
    $('pw2row').hidden = m !== 'signup';
    $('go').textContent = m === 'login' ? '로그인' : '회원가입';
    $('err').textContent = '';
  }
  async function submitAuth(e){
    e.preventDefault();
    const name = $('uid').value.trim(), pw = $('pw').value, err = $('err');
    err.textContent = '';
    if (!db){ err.textContent = '로그인을 쓸 수 없어요'; return; }
    if (!/^[A-Za-z0-9_가-힣]{2,16}$/.test(name)){ err.textContent = '아이디는 2~16자의 글자, 숫자, _ 만 쓸 수 있어요'; return; }
    if (pw.length < 4){ err.textContent = '비밀번호는 4자 이상이어야 해요'; return; }
    $('go').disabled = true;
    try {
      const ref = db.doc('accounts/' + keyOf(name)), snap = await ref.get();
      if (mode === 'signup'){
        if (pw !== $('pw2').value){ err.textContent = '비밀번호가 서로 달라요'; return; }
        if (snap.exists){ err.textContent = '이미 있는 아이디예요'; return; }
        const salt = hex(crypto.getRandomValues(new Uint8Array(16)));
        const hash = await hashPw(name, pw, salt);
        await ref.set({ name, salt, hash, unlocked: 0, created: Date.now() });
        enter({ key: keyOf(name), name, hash }, { unlocked: 0 }, $('autoNew').checked);
      } else {
        const d = snap.exists && snap.data();
        const hash = d ? await hashPw(d.name, pw, d.salt) : '';
        if (!d || hash !== d.hash){ err.textContent = '아이디 또는 비밀번호가 맞지 않아요'; return; }
        enter({ key: keyOf(name), name: d.name, hash }, d, $('autoNew').checked);
      }
      $('auth').hidden = true; $('pw').value = ''; $('pw2').value = '';
    } catch (ex) {
      err.textContent = '처리하지 못했어요. 잠시 뒤에 다시 시도해 주세요';
    } finally { $('go').disabled = false; }
  }
  $('openAuth').onclick = () => { setMode('login'); $('auth').hidden = false; $('uid').focus(); };
  $('closeAuth').onclick = () => { $('auth').hidden = true; };
  $('tabLogin').onclick = () => setMode('login');
  $('tabSignup').onclick = () => setMode('signup');
  $('authForm').addEventListener('submit', submitAuth);
  $('logout').onclick = logout;
  $('auto').onchange = e => setAuto(e.target.checked);

  load(0);
  renderAcct();
  (async function initAuth(){
    try {
      db = window.claude && window.claude.use ? await window.claude.use('db') : null;
    } catch (e) { db = null; }
    renderAcct();
    if (!db) return;
    try {
      const saved = JSON.parse(localStorage.getItem(AUTO) || 'null');
      if (!saved) return;
      const snap = await db.doc('accounts/' + saved.key).get();
      const d = snap.exists && snap.data();
      if (d && d.hash === saved.hash) enter({ key: saved.key, name: d.name, hash: d.hash }, d, true);
      else setAuto(false);
    } catch (e) {}
  })();
})();
</script>
