<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1220">
<title>점 잇기 퍼즐</title>
<style>
  /* Layout: 가운데 한 줄 화면. 위에서부터 상단바, 난이도, 진행, 판, 안내, 하단 독 */
  :root{
    --ink:#eef2fb;--ink2:#c3cce0;--muted:#8f9ab3;
    --glass:rgba(12,18,32,.68);--glass2:rgba(24,32,54,.82);--edge:rgba(255,255,255,.13);--edge2:rgba(255,255,255,.24);
    --accent:#6b9bff;--accent2:#8d7bff;--ok:#6df0a8;--danger:#ff7a86;
    --font:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
    --bg:#0a1220;color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
  body{height:100vh;height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--font);text-rendering:optimizeLegibility;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
  [hidden]{display:none!important}
  #app{width:min(100%,520px);flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:8px}
  button{font:inherit;color:var(--ink);background:var(--glass);border:1px solid var(--edge);border-radius:12px;padding:8px 14px;cursor:pointer;
    position:relative;overflow:hidden;min-height:36px;transition:transform .1s ease,box-shadow .2s ease,border-color .2s ease,background-color .2s ease,opacity .2s}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button:disabled{opacity:.35;cursor:default}
  button:not(:disabled):active{transform:scale(.94)}
  @media (hover:hover){button:not(:disabled):hover{border-color:var(--edge2);box-shadow:0 0 0 3px rgba(107,155,255,.22)}}
  .rip{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.34);transform:scale(0);animation:rip .5s ease-out forwards}
  @keyframes rip{to{transform:scale(1);opacity:0}}
  .ic{display:block;flex:none}
  svg.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* 상단바 */
  .top{width:100%;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
  .icoBtn{width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:14px;background:var(--glass);box-shadow:0 4px 14px rgba(0,0,0,.35)}
  #openSettings svg{transition:transform .45s ease}
  @media (hover:hover){#openSettings:hover svg{transform:rotate(60deg)}}
  #openSettings:active svg{transform:rotate(60deg)}
  .ttl{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;text-shadow:0 1px 3px rgba(0,0,0,.75),0 0 14px rgba(0,0,0,.55)}
  #lvl{font-variant-numeric:tabular-nums;display:flex;align-items:baseline;justify-content:center;gap:5px;white-space:nowrap;max-width:100%}
  .ttl{min-width:0}
  body.rnd #lvl b{font-size:24px}body.rnd #lvl .of{font-size:11.5px}body.rnd #lvl .lab{font-size:11px;letter-spacing:.08em}
  #lvl .lab{font-size:12px;letter-spacing:.16em;color:#fff;font-weight:600}
  #lvl b{font-size:30px;font-weight:800;letter-spacing:-.01em}
  #lvl .of{font-size:13px;color:#fff;font-weight:600}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .chip.k2{--c:#ff6b78;color:var(--c);border-color:color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 18%,rgba(12,18,32,.7));margin-top:3px;padding:2px 10px;font-size:11px;letter-spacing:.1em}

  /* 난이도: 미끄러지는 선택 표시 */
  #modes{position:relative;width:100%;display:grid;grid-template-columns:repeat(5,1fr);padding:4px;border-radius:16px;background:var(--glass);border:1px solid var(--edge);--i:0}
  #modes .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / 5);border-radius:12px;transform:translateX(calc(var(--i) * 100%));
    background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.1));border:1px solid var(--edge2);box-shadow:0 4px 14px rgba(0,0,0,.35);transition:transform .32s cubic-bezier(.3,.9,.3,1.1)}
  #modes button{position:relative;z-index:1;background:none;border:0;box-shadow:none!important;min-height:34px;padding:6px 4px;font-size:14px;font-weight:700;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px}
  #modes button::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sc);box-shadow:0 0 8px var(--sc);flex:none}
  #modes button[data-mode=easy]{--sc:#4fd6e8}#modes button[data-mode=normal]{--sc:#ff9ec7}#modes button[data-mode=hard]{--sc:#ffa24d}#modes button[data-mode=extreme]{--sc:#b9d6ff}#modes button[data-mode=random]{--sc:#d2a8ff}
  #modes button.on{color:#fff}

  /* 진행 */
  .stats{width:100%;display:flex;align-items:center;gap:8px}
  .meter{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
  .meter i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--ok));transition:width .3s ease}

  /* 판 */
  .boardwrap{padding:6px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.04));border:1px solid var(--edge);box-shadow:0 14px 36px rgba(0,0,0,.5)}
  canvas#c{display:block;aspect-ratio:1;touch-action:none;border-radius:14px;background:#0b0e15}
  .under{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px}
  #msg{min-height:20px;line-height:20px;font-size:14px;font-weight:700;color:var(--ok);text-shadow:0 1px 6px rgba(0,0,0,.6);text-align:center}

  /* 하단 독 */
  .dock{width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .dk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:7px 2px 6px;min-height:54px;border-radius:16px;font-size:11px;font-weight:600;color:var(--ink2);box-shadow:0 4px 14px rgba(0,0,0,.35)}
  .dk svg{width:22px;height:22px}
  .dk span{font-variant-numeric:tabular-nums}
  #hint:not(:disabled){color:#ffe08a}
  button.go{border-color:var(--ok);color:var(--ok);animation:goPulse 1.3s ease-in-out infinite}
  @keyframes goPulse{50%{box-shadow:0 0 0 5px rgba(109,240,168,.28)}}

  /* 창(설정, 스테이지 목록) */
  .scrim{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(3,6,14,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:8;touch-action:auto}
  .panel{background:var(--glass2);border:1px solid var(--edge2);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.6);display:flex;flex-direction:column}
  .phead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 14px 10px 18px}
  .phead h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
  .xBtn{width:36px;height:36px;min-height:0;padding:0;display:flex;align-items:center;justify-content:center;border-radius:12px;background:rgba(255,255,255,.08)}
  #settings .panel{width:min(100%,360px)}
  #settings .body{padding:2px 18px 18px;display:flex;flex-direction:column;gap:6px}
  .srow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;border-bottom:1px solid rgba(255,255,255,.08);font-size:15px;font-weight:600}
  .srow .l{display:flex;align-items:center;gap:12px}
  .badge{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1)}
  .sw{width:54px;height:32px;min-height:0;border-radius:16px;padding:0;background:rgba(255,255,255,.16);border:1px solid var(--edge)}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#dfe5f3;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .2s cubic-bezier(.3,.9,.3,1.2)}
  .sw[aria-pressed=true]{background:linear-gradient(90deg,var(--accent),var(--accent2));border-color:transparent}
  .sw[aria-pressed=true]::after{transform:translateX(22px);background:#fff}
  button.danger{color:var(--danger);border-color:rgba(255,122,134,.5);background:rgba(255,122,134,.1)}
  #confirm{margin-top:8px;background:rgba(255,122,134,.1);border:1px solid rgba(255,122,134,.4);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;text-align:center}
  #confirm p{margin:0;font-weight:700}
  .row{display:flex;gap:8px}.row button{flex:1}
  #settings .hint{margin:10px 0 2px;font-size:12px;color:var(--muted);text-align:center}
  button.primary{color:#fff;border:0;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 6px 18px rgba(107,155,255,.4);font-weight:700}
  #sel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,520px);max-height:72vh;max-height:72dvh;z-index:7;overflow:hidden;touch-action:pan-y;overscroll-behavior:contain}
  #sel .phead{padding-bottom:6px}
  #sel .sub{padding:0 18px 8px;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
  #gridwrap{overflow-y:auto;padding:0 14px 14px;overscroll-behavior:contain;touch-action:pan-y}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px}
  #grid button{padding:9px 0;min-height:40px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;border-radius:12px;color:var(--ink2);background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1)}
  #grid button.done{color:#fff;background:linear-gradient(180deg,rgba(109,240,168,.26),rgba(109,240,168,.1));border-color:rgba(109,240,168,.45)}
  #grid button.k1:not(.done),#grid button.k2:not(.done){border-color:rgba(255,162,77,.5)}
  #grid button.k2:not(.done){border-color:rgba(255,107,120,.6)}
  #grid button.cur{outline:2px solid #fff;outline-offset:1px;color:#fff}

  /* 클리어 */
  #clearBanner{position:fixed;left:0;top:0;right:0;bottom:0;z-index:6;display:flex;align-items:center;justify-content:center;pointer-events:none}
  #clearBanner .cb{text-align:center;padding:22px 40px;border-radius:26px;background:linear-gradient(180deg,rgba(24,32,54,.88),rgba(10,16,30,.88));border:1px solid var(--edge2);box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 6px rgba(109,240,168,.12)}
  #clearBanner .stars{font-size:26px;letter-spacing:.2em;color:#ffd66b;text-shadow:0 0 16px rgba(255,214,107,.7)}
  #clearBanner .cbt{font-size:40px;font-weight:900;letter-spacing:.08em;background:linear-gradient(90deg,#6df0a8,#6b9bff);-webkit-background-clip:text;background-clip:text;color:transparent}
  #clearBanner .cbs{font-size:14px;color:var(--ink2);font-weight:600;margin-top:2px}
  #clearBanner:not([hidden]) .cb{animation:cbIn .5s cubic-bezier(.2,.9,.3,1.25) .3s both}
  #clearBanner.out .cb{animation:cbOut .3s ease both}
  @keyframes cbIn{from{opacity:0;transform:scale(.6) translateY(20px)}to{opacity:1;transform:none}}
  @keyframes cbOut{to{opacity:0;transform:scale(.95) translateY(-8px)}}

  /* 메인 화면 */
  body:not(.in-game) #app{visibility:hidden}
  #home{position:fixed;left:0;top:0;right:0;bottom:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;touch-action:none}
  #home .emblem{width:clamp(110px,34vw,150px);height:auto;filter:drop-shadow(0 10px 24px rgba(0,0,0,.5))}
  #home .logo{font-size:clamp(34px,11vw,56px);font-weight:900;letter-spacing:-.02em;text-align:center;text-wrap:balance;background:linear-gradient(180deg,#fff,#cfdcff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 20px rgba(0,0,0,.55))}
  #home .tag{font-size:14px;color:var(--ink2);text-shadow:0 2px 10px rgba(0,0,0,.7);margin-bottom:22px;text-align:center}
  #playBtn{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:800;letter-spacing:.14em;padding:16px 54px 16px 46px;min-height:0;border-radius:999px;color:#fff;border:1px solid rgba(255,255,255,.55);
    background:linear-gradient(180deg,#86abff,#4d6fe8 60%,#6a58e6);box-shadow:0 12px 34px rgba(80,110,255,.55),inset 0 2px 0 rgba(255,255,255,.4);animation:playPulse 2.2s ease-in-out infinite}
  @keyframes playPulse{50%{transform:scale(1.05)}}
  #home:not([hidden]){animation:mIn .35s ease both}
  #home .tube{stroke-dasharray:240;stroke-dashoffset:240;animation:draw 1.3s .2s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}

  /* 로딩 */
  #fade{position:fixed;left:0;top:0;right:0;bottom:0;z-index:20;background:#000;opacity:0;pointer-events:none;display:flex;align-items:center;justify-content:center;transition:opacity .7s ease}
  #fade.on{opacity:1;pointer-events:auto}
  #loadTxt{color:var(--ink);font-size:20px;font-weight:600;letter-spacing:.08em;opacity:0;transition:opacity .35s ease}
  #fade.on #loadTxt.show{opacity:1}
  #loadTxt .d{animation:blink 1.2s infinite;opacity:.2}
  #loadTxt .d:nth-child(2){animation-delay:.2s}#loadTxt .d:nth-child(3){animation-delay:.4s}
  @keyframes blink{40%{opacity:1}}

  /* 부드러운 움직임 */
  #settings:not([hidden]),#records:not([hidden]),#modeSheet:not([hidden]),#mp:not([hidden]),#mpEnd:not([hidden]){animation:mIn .24s ease both}
  #settings:not([hidden]) .panel,#records:not([hidden]) .panel,#modeSheet:not([hidden]) .panel,#mp:not([hidden]) .panel,#mpEnd:not([hidden]) .panel{animation:boxIn .3s cubic-bezier(.2,.9,.3,1.15) both}
  #settings.out,#records.out,#modeSheet.out,#mp.out,#mpEnd.out{animation:mOut .19s ease both}
  #settings.out .panel,#records.out .panel,#modeSheet.out .panel,#mp.out .panel,#mpEnd.out .panel{animation:boxOut .19s ease both}
  #sel:not([hidden]){animation:selIn .26s cubic-bezier(.2,.9,.3,1.1) both}
  #sel.out{animation:selOut .19s ease both}
  .stagein{animation:stageIn .38s cubic-bezier(.2,.9,.3,1.1) both}
  .boardwrap.pop{animation:boardPop .75s cubic-bezier(.2,.8,.3,1) both}
  @keyframes boardPop{0%{transform:none;box-shadow:0 14px 36px rgba(0,0,0,.5)}35%{transform:scale(1.025);box-shadow:0 14px 44px rgba(0,0,0,.5),0 0 38px rgba(255,224,138,.55)}100%{transform:none;box-shadow:0 14px 36px rgba(0,0,0,.5)}}
  .msgpop{animation:msgPop .35s ease both}
  @keyframes mIn{from{opacity:0}to{opacity:1}}
  @keyframes mOut{to{opacity:0}}
  @keyframes boxIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
  @keyframes boxOut{to{opacity:0;transform:translateY(10px) scale(.97)}}
  @keyframes selIn{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  @keyframes selOut{to{opacity:0;transform:translate(-50%,-47%) scale(.97)}}
  @keyframes stageIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
  @keyframes msgPop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  @media (max-width:400px){#modes button{font-size:12.5px;gap:4px;padding:6px 1px}#modes button::before{width:6px;height:6px}}
  @media (max-width:340px){#modes button::before{display:none}}
  @media (max-height:700px){#lvl b{font-size:26px}.dk{min-height:48px;padding:5px 2px}}
  @media (max-height:480px){html,body{overflow:auto}body{height:auto;min-height:100%}}
  /* 모션 줄이기: 모든 움직임을 끈다 */
  .reduce *,.reduce *::before,.reduce *::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0s!important}
  .reduce #playBtn,.reduce button.go{animation:none!important}
  .reduce #home .tube{stroke-dashoffset:0}
  .reduce #loadTxt .d{animation:none!important;opacity:1}

  /* 모드 선택 · 멀티플레이 */
  .cards{padding:2px 18px 18px;display:flex;flex-direction:column;gap:10px}
  .card{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:14px 16px;border-radius:16px;text-align:left;min-height:0;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.05));border-color:var(--edge2)}
  .card b{font-size:17px;font-weight:800}.card span{font-size:12.5px;color:var(--ink2);font-weight:600}
  .card.mpc b{color:#9fe3ff}.card.rdc b{color:#d2a8ff}
  #mp .panel,#mpEnd .panel,#modeSheet .panel{width:min(100%,360px)}
  #mp .body{padding:2px 18px 18px;display:flex;flex-direction:column;gap:10px}
  .lab2{font-size:13px;color:var(--ink2);font-weight:700}
  .dchips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .dchips button{padding:8px 2px;font-size:13.5px;font-weight:700;min-height:0;border-radius:12px;color:var(--ink2)}
  .dchips button.on{color:#fff;border-color:var(--accent);background:linear-gradient(180deg,rgba(107,155,255,.35),rgba(107,155,255,.12));box-shadow:0 0 0 3px rgba(107,155,255,.2)}
  .txin{height:46px;border-radius:14px;border:1px solid var(--edge2);background:rgba(255,255,255,.08);color:var(--ink);padding:0 14px;font:inherit;font-size:22px;font-weight:800;letter-spacing:.14em;text-align:center;-webkit-user-select:text;user-select:text;width:100%}
  #mpInfo{min-height:18px;font-size:13px;font-weight:600;color:var(--ok);text-align:center}
  #mpInfo.err{color:var(--danger)}
  #mpEnd .panel{text-align:center;padding:22px 20px 20px;gap:12px}
  #mpEnd h2{margin:0;font-size:28px;font-weight:900;background:linear-gradient(90deg,#6df0a8,#6b9bff);-webkit-background-clip:text;background-clip:text;color:transparent}
  #mpEndTxt{margin:0;color:var(--ink2);font-weight:600}
  #mpWait{margin:0;min-height:18px;font-size:13px;color:var(--ok);font-weight:700}
  #prev.leave{color:var(--danger)}
</style>
</head>
<body>
<div id="fade" aria-hidden="true"><div id="loadTxt">로딩중<span class="d">.</span><span class="d">.</span><span class="d">.</span></div></div>

<div id="home">
  <svg class="emblem" viewBox="0 0 120 120" aria-hidden="true">
    <defs>
      <radialGradient id="bR" cx="35%" cy="32%" r="75%"><stop offset="0" stop-color="#ffd0d0"/><stop offset=".45" stop-color="#ff4d4d"/><stop offset="1" stop-color="#a81d2a"/></radialGradient>
      <radialGradient id="bB" cx="35%" cy="32%" r="75%"><stop offset="0" stop-color="#cfe7ff"/><stop offset=".45" stop-color="#3fa9ff"/><stop offset="1" stop-color="#1b5fb5"/></radialGradient>
      <radialGradient id="bY" cx="35%" cy="32%" r="75%"><stop offset="0" stop-color="#fff2b8"/><stop offset=".45" stop-color="#ffd23f"/><stop offset="1" stop-color="#c58a0a"/></radialGradient>
    </defs>
    <path class="tube" d="M22 94 V52 Q22 30 44 30 H76 Q98 30 98 52 V94" fill="none" stroke="#7a1520" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="tube" d="M22 94 V52 Q22 30 44 30 H76 Q98 30 98 52 V94" fill="none" stroke="#ff4d4d" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="tube" d="M22 94 V52 Q22 30 44 30 H76 Q98 30 98 52 V94" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(-2 -2)"/>
    <path d="M52 94 V70 H68 V94" fill="none" stroke="#164d8c" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M52 94 V70 H68 V94" fill="none" stroke="#3fa9ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="22" cy="94" r="10" fill="url(#bR)"/><circle cx="98" cy="94" r="10" fill="url(#bR)"/>
