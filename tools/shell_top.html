<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10131c">
<title>점 잇기 퍼즐</title>
<style>
  /* Layout: centered single-column game board with a compact status bar above */
  :root{--bg:#10131c;--panel:#1a1f2e;--fg:#e8ecf5;--muted:#8791a8;--line:#2a3147;--accent:#5b8cff;--ok:#7dffb0;color-scheme:dark}
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;padding-inline:16px;padding-block:16px;display:flex;flex-direction:column;align-items:center;gap:12px;-webkit-user-select:none;user-select:none}
  h1{margin:4px 0 0;font-size:22px;text-wrap:balance}
  .sub{color:var(--muted);font-size:13px;margin:0;text-align:center;max-width:46ch}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
  button{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:15px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--accent)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .stat{background:var(--panel);border-radius:10px;padding:8px 14px;font-size:14px;text-align:center;font-variant-numeric:tabular-nums}
  canvas{width:min(100%,520px);aspect-ratio:1;touch-action:none;border-radius:14px;background:#0b0e15}
  #msg{min-height:24px;font-weight:600;color:var(--ok)}
  button:disabled{opacity:.35;cursor:default}
  button.go{border-color:var(--ok);color:var(--ok);animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 4px #7dffb033}}
  @media (prefers-reduced-motion:reduce){button.go{animation:none}}
  .chip{border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
  .chip.k0,#grid .k0{--c:#3ddc84}.chip.k1,#grid .k1{--c:#ffd23f}.chip.k2,#grid .k2{--c:#ff4d4d}.chip.k3,#grid .k3{--c:#4dd2ff}
  .chip{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
  #sel{width:min(100%,520px);max-height:260px;overflow-y:auto;background:var(--panel);border-radius:12px;padding:10px}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
  #grid button{padding:8px 0;font-size:13px;font-variant-numeric:tabular-nums;border-color:color-mix(in srgb,var(--c) 40%,var(--line))}
  #grid button.done{background:color-mix(in srgb,var(--c) 16%,var(--panel))}
  #grid button.cur{outline:2px solid var(--fg)}
  .acct{display:flex;flex-direction:column;align-items:center;gap:6px}
  #userBox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
  .note{color:var(--muted);font-size:12px}
  .chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
  #auth{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
  #auth[hidden]{display:none}
  #authForm{background:var(--panel);border-radius:14px;padding:18px;width:min(100%,340px);display:flex;flex-direction:column;gap:8px}
  #authForm label{font-size:13px;color:var(--muted)}
  #authForm input[type=text],#authForm input[type=password],#uid{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:15px;font-family:inherit}
  .tabs,.row{display:flex;gap:8px}
  .tabs button{flex:1}.tabs button.on{border-color:var(--accent);color:var(--accent)}
  .row .primary{flex:1;background:var(--accent);border-color:var(--accent);color:#fff}
  #err{min-height:18px;font-size:13px;color:#ff7a7a}
  html{overscroll-behavior:none;-webkit-text-size-adjust:100%}
  body{min-height:100%;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;padding-bottom:max(16px,env(safe-area-inset-bottom))}
  button{min-height:40px}
  /* 모바일: 주소창·하단 막대에 가리지 않게 아래 여백을 크게 두고, 판이 한 화면에 들어오도록 높이에 맞춘다 */
  [hidden]{display:none!important}
  /* 스크롤 없이 한 화면에: 판 크기는 자바스크립트가 남은 높이에 맞춘다 */
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{height:100vh;height:100dvh;box-sizing:border-box;touch-action:none;gap:8px;padding-block:10px calc(10px + env(safe-area-inset-bottom))}
  h1{margin:0;font-size:20px}
  .acct{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:4px 10px}
  .acct .note{flex-basis:100%;text-align:center;font-size:12px}
  #sel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,520px);max-height:70vh;max-height:70dvh;z-index:7;box-shadow:0 10px 40px rgba(0,0,0,.6);touch-action:pan-y;overscroll-behavior:contain}
  @media (max-height:760px){.sub{display:none}}
  /* 좁은 화면: 머리 부분을 낮춰 판에 높이를 더 준다 */
  button{min-height:36px;padding:6px 11px;font-size:14px}
  .stat{padding:6px 10px;font-size:13px}
  .bar{gap:6px}
  #modes{gap:5px}
  #modes button{padding:6px 12px}
  #msg{min-height:20px;line-height:20px;font-size:14px}
  h1{font-size:19px}
  @media (max-height:480px){html,body{overflow:auto}body{height:auto;min-height:100%}}
  .head{position:relative;display:flex;justify-content:center;align-items:center;width:min(100%,520px)}
  #openSettings{position:absolute;right:0;top:50%;transform:translateY(-50%);width:40px;height:40px;min-height:0;padding:0;display:flex;align-items:center;justify-content:center;border-radius:12px}
  #openSettings svg{transition:transform .4s ease}
  #openSettings:hover svg,#openSettings:active svg{transform:rotate(60deg)}
  #openSettings:not(:disabled):active{transform:translateY(-50%) scale(.94)}
  #settings{position:fixed;left:0;top:0;right:0;bottom:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:8;touch-action:auto}
  #settings .box{background:var(--panel);border-radius:14px;padding:18px;width:min(100%,340px);display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
  #settings h2{margin:0;font-size:18px}
  .srow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;min-height:36px}
  .sw{width:52px;height:30px;min-height:0;border-radius:15px;padding:0;position:relative;background:#3a4255;border:1px solid var(--line)}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#cfd6e6;transition:transform .15s}
  .sw[aria-pressed=true]{background:var(--accent);border-color:var(--accent)}
  .sw[aria-pressed=true]::after{transform:translateX(22px);background:#fff}
  button.danger{border-color:#b04a4a;color:#ff9a9a}
  #confirm{background:#2a1c1c;border:1px solid #6b3434;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;text-align:center}
  #confirm p{margin:0;font-weight:600}
  #settings .row{display:flex;gap:8px}
  #settings .row button{flex:1}
  #settings .hint{margin:0;font-size:12px;color:var(--muted);text-align:center}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .selhead{position:sticky;top:-10px;z-index:1;margin:-10px -10px 8px;padding:10px 10px 8px;background:var(--panel);display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:15px;border-radius:12px 12px 0 0}
  #closeSel{min-height:0;width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;font-size:16px;border-radius:10px}
</style>
</head>
<body>
<div class="head"><h1>점 잇기 퍼즐</h1><button type="button" id="openSettings" aria-label="설정" title="설정"><svg viewBox="-12 -12 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M-3.01 -7.09 L-2.25 -10.15 L2.25 -10.15 L3.01 -7.09 L4.63 -6.15 L7.67 -7.03 L9.92 -3.13 L7.64 -0.94 L7.64 0.94 L9.92 3.13 L7.67 7.03 L4.63 6.15 L3.01 7.09 L2.25 10.15 L-2.25 10.15 L-3.01 7.09 L-4.63 6.15 L-7.67 7.03 L-9.92 3.13 L-7.64 0.94 L-7.64 -0.94 L-9.92 -3.13 L-7.67 -7.03 L-4.63 -6.15 Z"/><circle r="3.3"/></svg></button></div>
<p class="sub">같은 색 점끼리 선으로 연결하고, 판의 모든 칸을 채우세요. 선은 서로 겹칠 수 없어요.</p>
<div id="settings" hidden>
  <div class="box" role="dialog" aria-label="설정">
    <h2>설정</h2>
    <div class="srow"><span>배경음악</span><button type="button" id="tgMusic" class="sw" aria-pressed="true" aria-label="배경음악"></button></div>
    <div class="srow"><span>효과음</span><button type="button" id="tgSfx" class="sw" aria-pressed="true" aria-label="효과음"></button></div>
    <div class="srow"><span>진행 상황</span><button type="button" id="resetAll" class="danger">초기화</button></div>
    <div id="confirm" hidden>
      <p>정말 초기화 하시겠습니까?</p>
      <div class="row"><button type="button" id="yes" class="danger">예</button><button type="button" id="no">아니요</button></div>
    </div>
    <p class="hint">진행 상황은 이 기기에 자동으로 저장돼요.</p>
    <button type="button" id="closeSettings" class="primary">닫기</button>
  </div>
</div>
<div class="bar">
  <button id="prev" aria-label="이전 스테이지">◀</button>
  <div class="stat" id="lvl">스테이지 1</div><div class="chip k0" id="diff" hidden></div>
  <button id="next" aria-label="다음 스테이지">▶</button>
  <div class="stat" id="flows">연결 0/0</div>
  <div class="stat" id="fill">채움 0%</div>
  <button id="hint">힌트</button>
  <button id="reset">다시</button>
  <button id="pick">목록</button>
</div>
<canvas id="c" width="520" height="520"></canvas>
<div id="msg"></div>
<div id="sel" hidden>
  <div class="selhead"><span>스테이지 목록</span><button type="button" id="closeSel" aria-label="목록 닫기">✕</button></div>
  <div id="grid"></div>
</div>
<script>
